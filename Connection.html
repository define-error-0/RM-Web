    // YMODEM协议主入口（重写，所有ACK/NAK等通过serialBuffer消费）
    async function ymodemSend(fileData, fileName, onProgress) {
      window._isYmodemBusy = true;
      try {
        // YMODEM常量
        const SOH = 0x01, STX = 0x02, EOT = 0x04, ACK = 0x06, NAK = 0x15, CAN = 0x18, CRC = 0x43;
        const PACKET_SIZE = 1024;
        const PACKET_SIZE_128 = 128;
        const MAX_RETRY = 10;
        const TIMEOUT = 5000; // ms
        // 工具函数
        function crc16(buf) {
          let crc = 0;
          for (let i = 0; i < buf.length; i++) {
            crc ^= (buf[i] << 8);
            for (let j = 0; j < 8; j++) {
              if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
              else crc <<= 1;
            }
          }
          return crc & 0xFFFF;
        }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // 通过serialBuffer消费ACK/NAK等控制字节
        async function ymodemWaitAckFromSerialBuffer(expect, timeout = TIMEOUT) {
          const start = Date.now();
          while (Date.now() - start < timeout) {
            if (serialBuffer.length > 0) {
              // 只消费控制字节
              for (let i = 0; i < serialBuffer.length; i++) {
                const b = serialBuffer[i];
                if ([ACK, NAK, CAN, CRC, EOT].includes(b)) {
                  serialBuffer.splice(i, 1); // 消费掉
                  console.log(`[YMODEM][RECV] 控制字节: 0x${b.toString(16).padStart(2,'0')} (${b === ACK ? 'ACK' : b === NAK ? 'NAK' : b === CAN ? 'CAN' : b === CRC ? 'CRC' : b === EOT ? 'EOT' : ''})`);
                  if (expect.includes(b)) return b;
                  if (b === CAN) throw new Error('对方中止传输');
                  // 不是期望的，继续等
                }
              }
            }
            await sleep(10);
          }
          throw new Error('超时未收到ACK/NAK');
        }

        // 1. 等待C
        let retry = 0;
        while (retry++ < MAX_RETRY) {
          try {
            console.log('[YMODEM] 等待C (0x43) 握手...');
            await ymodemWaitAckFromSerialBuffer([CRC], 3000);
            console.log('[YMODEM] 收到C (0x43)，握手成功');
            break;
          } catch (e) {
            console.warn(`[YMODEM] 握手未收到C，重试${retry}/${MAX_RETRY}`);
            if (retry >= MAX_RETRY) throw new Error('未收到C，设备未响应');
          }
        }
        // 2. 发送头包（SOH+128字节）
        let header = new Uint8Array(PACKET_SIZE_128 + 5);
        header[0] = SOH;
        header[1] = 0x00; // 包号
        header[2] = 0xFF;
        //c:\Users\11868\Desktop\project\Web\RadioMasterWeb.html 文件名和大小
        let nameBytes = new TextEncoder().encode(fileName);
        let sizeBytes = new TextEncoder().encode(fileData.length.toString());
        header.set(nameBytes, 3);
        header[3 + nameBytes.length] = 0x00;
        header.set(sizeBytes, 4 + nameBytes.length);
        header[4 + nameBytes.length + sizeBytes.length] = 0x00;
        // 填充0
        for (let i = 3 + nameBytes.length + 1 + sizeBytes.length + 1; i < 3 + PACKET_SIZE_128; i++) header[i] = 0;
        // CRC
        let crc = crc16(header.slice(3, 3 + PACKET_SIZE_128));
        header[PACKET_SIZE_128 + 3] = (crc >> 8) & 0xFF;
        header[PACKET_SIZE_128 + 4] = crc & 0xFF;
        // 头包重发
        retry = 0;
        while (retry++ < MAX_RETRY) {
          console.log('[YMODEM][SEND] 头包:', Array.from(header).map(b=>b.toString(16).padStart(2,'0')).join(' '));
          await writer.write(header);
          let gotAck = false;
          const start = Date.now();
          while (Date.now() - start < TIMEOUT) {
            if (serialBuffer.length > 0) {
              for (let i = 0; i < serialBuffer.length; i++) {
                const b = serialBuffer[i];
                if (b === ACK) {
                  serialBuffer.splice(i, 1);
                  gotAck = true;
                  console.log('[YMODEM][RECV] 头包收到ACK (0x06)');
                  break;
                }
                if ([CRC, NAK, CAN].includes(b)) {
                  serialBuffer.splice(i, 1);
                  if (b === NAK) {
                    console.warn('[YMODEM][RECV] 收到NAK，重发头包');
                    break;
                  }
                  if (b === CAN) throw new Error('对方中止传输');
                  // 0x43 (C) 这里直接忽略，后面统一清理
                }
              }
            }
            if (gotAck) break;
            await sleep(10);
          }
          if (gotAck) {
            // 清理所有C(0x43)
            let removed = 0;
            for (let i = serialBuffer.length - 1; i >= 0; i--) {
              if (serialBuffer[i] === CRC) {
                serialBuffer.splice(i, 1);
                removed++;
              }
            }
            if (removed > 0) console.log(`[YMODEM] 握手后清理了${removed}个C(0x43)`);
            break;
          }
          if (retry >= MAX_RETRY) throw new Error('头包未被ACK');
        }
        // 3. 发送数据包（STX+1024字节）
        let total = fileData.length;
        let sent = 0;
        let pktNum = 1;
        while (sent < total) {
          let chunk = fileData.slice(sent, sent + PACKET_SIZE);
          let pkt = new Uint8Array(PACKET_SIZE + 5);
          pkt[0] = STX;
          pkt[1] = pktNum & 0xFF;
          pkt[2] = 0xFF - pkt[1];
          pkt.set(chunk, 3);
          for (let i = 3 + chunk.length; i < 3 + PACKET_SIZE; i++) pkt[i] = 0x1A; // 填充Ctrl+Z
          let crc = crc16(pkt.slice(3, 3 + PACKET_SIZE));
          pkt[PACKET_SIZE + 3] = (crc >> 8) & 0xFF;
          pkt[PACKET_SIZE + 4] = crc & 0xFF;
          retry = 0;
          while (retry++ < MAX_RETRY) {
            console.log(`[YMODEM][SEND] 数据包#${pktNum}:`, Array.from(pkt).map(b=>b.toString(16).padStart(2,'0')).join(' '));
            await writer.write(pkt);
            try {
              let ack = await ymodemWaitAckFromSerialBuffer([ACK, NAK], TIMEOUT);
              if (ack === ACK) { console.log(`[YMODEM][RECV] 数据包#${pktNum} 收到ACK`); break; }
              if (ack === NAK) { console.warn(`[YMODEM][RECV] 数据包#${pktNum} 收到NAK，重发`); }
            } catch (e) {
              if (retry >= MAX_RETRY) throw new Error('数据包未被ACK');
            }
          }
          sent += chunk.length;
          pktNum = (pktNum + 1) & 0xFF;
          if (onProgress) onProgress(sent, total);
        }
        // 4. 发送EOT
        retry = 0;
        while (retry++ < MAX_RETRY) {
          console.log('[YMODEM][SEND] EOT (0x04)');
          await writer.write(new Uint8Array([EOT]));
          try {
            let ack = await ymodemWaitAckFromSerialBuffer([ACK], TIMEOUT);
            if (ack === ACK) { console.log('[YMODEM][RECV] EOT收到ACK'); break; }
          } catch (e) {
            if (retry >= MAX_RETRY) throw new Error('EOT未被ACK');
          }
        }
        // 5. 结束包（SOH+128字节空包）
        let endPkt = new Uint8Array(PACKET_SIZE_128 + 5);
        endPkt[0] = SOH;
        endPkt[1] = 0x00;
        endPkt[2] = 0xFF;
        for (let i = 3; i < 3 + PACKET_SIZE_128; i++) endPkt[i] = 0;
        let endCrc = crc16(endPkt.slice(3, 3 + PACKET_SIZE_128));
        endPkt[PACKET_SIZE_128 + 3] = (endCrc >> 8) & 0xFF;
        endPkt[PACKET_SIZE_128 + 4] = endCrc & 0xFF;
        retry = 0;
        while (retry++ < MAX_RETRY) {
          console.log('[YMODEM][SEND] 结束包:', Array.from(endPkt).map(b=>b.toString(16).padStart(2,'0')).join(' '));
          await writer.write(endPkt);
          try {
            let ack = await ymodemWaitAckFromSerialBuffer([ACK], TIMEOUT);
            if (ack === ACK) { console.log('[YMODEM][RECV] 结束包收到ACK'); break; }
          } catch (e) {
            if (retry >= MAX_RETRY) throw new Error('结束包未被ACK');
          }
        }
        await sleep(100);
        console.log('[YMODEM] 传输完成');
      } finally {
        window._isYmodemBusy = false;
      }
    }

        try {
          const res = await fetch(url, { method: 'GET', cache: 'no-store' });
          return res.ok ? 'ok' : 'missing';
        } catch (e) {
          // file:// 或部分环境禁止 fetch：改为乐观加载 iframe，等 plane-ready
          return 'try';
        }
      };
      const [vRes, dRes] = await Promise.all([
        check(demo.paths.vtail),

      demo.available.vtail = (vRes === 'ok' || vRes === 'try');
      demo.available.delta = (dRes === 'ok' || dRes === 'try');

    function tryParseFlightModePacket(buf) {
      if (!buf || buf.length < 37 || buf[0] !== 0xAB) return false;
      // const calcCrc = crc8tab_js(buf.slice(2, 67), 65);
      // if (buf[36] !== calcCrc) {
      //   //console.warn('[飞行模式] CRC 失败', '期望', calcCrc, '实际', buf[36]);
      //   return false;
      // }
      const data = ensureFlightVData();
      const devSwitch = buf[2] & 0xFF;
      data.devSwitch = devSwitch;

      // 解析V-Tail数据（surfaceIdx=0，前32字节）
      for (let ch = 0; ch < 16; ch++) {
        const off = 3 + ch * 2;
        data.channelCtl[0][ch] = [buf[off] & 0xFF, buf[off + 1] & 0xFF];
      }

      // 解析Delta Wing数据（surfaceIdx=1，后32字节）
      for (let ch = 0; ch < 16; ch++) {
        const off = 35 + ch * 2;
        data.channelCtl[1][ch] = [buf[off] & 0xFF, buf[off + 1] & 0xFF];
      }

      console.log('[飞行模式] 0xAB 解析成功', {
        devSwitch: devSwitch,
        vTailChannels: data.channelCtl[0].slice(0, getFlightModeChannelCount()),
        deltaChannels: data.channelCtl[1].slice(0, getFlightModeChannelCount()),
        raw: Array.from(buf).map(x => '0x' + x.toString(16).padStart(2, '0').toUpperCase()).join(' ')
      });
      if (typeof window.applyFlightModeDataToUi === 'function') window.applyFlightModeDataToUi();
      if (typeof window.setFlightModePageDataReady === 'function') window.setFlightModePageDataReady(true);
      return true;
    }

    // ========== 设备信息包解析 ==========
    function parseDeviceInfoPacket(buf) {
      // buf: Uint8Array, 已经确认 buf[0]==0xFF
      const len = buf[1];
      const crc = buf[len+1];
      // console.log("crc:",crc);
      // console.log("len:",len);
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
      //console.log('[设备属性] 解析过程: len=', len, 'crc(包)=', crc, 'crc(计算)=', calcCrc);
      if (crc !== calcCrc) {
        //console.warn('[设备信息] CRC校验失败!');
        //return null;
      }
      else
      {
        let offset = 2;
        const devVolume = buf[offset];
        offset++;
        const serialNumber = new TextDecoder().decode(buf.slice(offset, offset+20)).replace(/\0.*$/, '');
        offset += 20;
        const elrsFirmWare = new TextDecoder().decode(buf.slice(offset, offset+20)).replace(/\0.*$/, '');
        offset += 20;
        const deviceFirmWare = new TextDecoder().decode(buf.slice(offset, offset+10)).replace(/\0.*$/, '');
        offset += 10;
        const elrsName = new TextDecoder().decode(buf.slice(offset, offset+50)).replace(/\0.*$/, '');
        offset += 50;
        const companyName = new TextDecoder().decode(buf.slice(offset, offset+20)).replace(/\0.*$/, '');
        offset += 20;
        const devName = new TextDecoder().decode(buf.slice(offset, offset+20)).replace(/\0.*$/, '');
        offset += 20;
        const sendPackSpeed = buf[offset];
        const returnSpeed = buf[offset+1];
        const calibrationFlag = buf[offset+2];
        const connectProtocol = buf[offset+3];
        const channelNum = buf[offset+4];
        const secretKey = buf[offset+5];
        const powerVal = buf[offset+6];
        const remoteCtlClass = buf[offset+7];
        const mixedCtl = buf[offset+8];
        const keyModel = buf.slice(offset + 9, offset + 9 + 6);;
        const slideMid = buf[offset+9+6];
        const slideMidData = buf[offset+9+8]*256 + buf[offset+9+7];
        const RxWarning = buf[offset+9+9];
        const LowPowerWarning = buf[offset+9+10];
        const LeftTrimReset = buf[offset+9+11];
        const RightTrimReset = buf[offset+9+12];

        let slideMT8Mid = [0,0,0,0,0,0];
        let slideMT8MidData = [2000,2000,2000,2000,2000,2000];
        let ledBrightness = 0;
        let workLedMode = 1;
        let warnVBeeFlag = 0;
        let warnVBeeValue = 0;
        let warnVBeeFreq = 0;
        let powerTime = 0;

        if(isMT8DeviceName(devName) || isMT6DeviceName(devName))
        {
          slideMT8Mid = [
            buf[offset+9+13] , buf[offset+9+14],
            buf[offset+9+15] , buf[offset+9+16],
            buf[offset+9+17] , buf[offset+9+18]];

          slideMT8MidData = [
            buf[offset+9+20]<<8 | buf[offset+9+19],
            buf[offset+9+22]<<8 | buf[offset+9+21],
            buf[offset+9+24]<<8 | buf[offset+9+23],
            buf[offset+9+26]<<8 | buf[offset+9+25],
            buf[offset+9+28]<<8 | buf[offset+9+27],
            buf[offset+9+30]<<8 | buf[offset+9+29],
          ];
          ledBrightness = Math.max(0, Math.min(100, buf[offset+9+31] || 0));
          workLedMode = clampLedMode(buf[offset+9+32] || 1);
          // MT8新增: 接收机警告相关属性 (offset+9+33开始，共5字节)
          offset = offset + 2;
          if (buf.length >= offset+9+33+5) {
            warnVBeeFlag = buf[offset+9+33] || 0;
            warnVBeeValue = (buf[offset+9+34] | buf[offset+9+35]<<8) || 0;
            warnVBeeFreq = (buf[offset+9+36] | buf[offset+9+37]<<8) || 0;
            powerTime = buf[offset+9+38] || 0;
          }
          console.log(warnVBeeFlag,warnVBeeValue,warnVBeeFreq);
          console.log(MT8_DEVICE_NAME);
        }
        else if(devName=="RadioMaster T8L")
        {
          // T8L新增: 接收机警告相关属性 (offset+9+13开始，共5字节)
          if (buf.length >= offset+9+13+5) {
            warnVBeeFlag = buf[offset+9+13] || 0;
            warnVBeeValue = (buf[offset+9+14] | buf[offset+9+15]<<8) || 0;
            warnVBeeFreq = (buf[offset+9+16] | buf[offset+9+17]<<8) || 0;
            powerTime = buf[offset+9+18] || 0;
          }
          console.log(warnVBeeFlag,warnVBeeValue,warnVBeeFreq);
          console.log("RadioMaster T8L");
        }


        //console.log("数据:",buf[offset+9+7],buf[offset+9+8]);
        // 打印所有字段
        console.log('[设备属性] 字段明细:', {
          devVolume, serialNumber, elrsFirmWare, deviceFirmWare, elrsName, companyName, devName,
          sendPackSpeed, returnSpeed, calibrationFlag, connectProtocol, channelNum, secretKey, powerVal, remoteCtlClass, mixedCtl,
          keyModel,slideMid,slideMidData,RxWarning,LowPowerWarning,LeftTrimReset,RightTrimReset,slideMT8Mid,slideMT8MidData,
          ledBrightness, workLedMode, warnVBeeFlag, warnVBeeValue, warnVBeeFreq, powerTime

        });
        return {
          devVolume, serialNumber, elrsFirmWare, deviceFirmWare, elrsName, companyName, devName,
          sendPackSpeed, returnSpeed, calibrationFlag, connectProtocol, channelNum, secretKey, powerVal, remoteCtlClass, mixedCtl,

          ledBrightness, workLedMode, warnVBeeFlag, warnVBeeValue, warnVBeeFreq, powerTime
        };
      }
    }

        return true;

        const folderDiv = document.createElement('div');

        // 初始显示第一个

        // 操作模式页面的摇杆绘制和下拉事件
        const drawModePage = () => {

        // 监听菜单切换到操作模式时绘制摇杆
        btns.forEach(btn => {

        });

        // 将通道数据（988-2012）转换为-500到500的输入值
        const convertChannelToInput = (channelValue) => {
          // 通道范围：988-2012，中间值1500
          // 转换为-500到500：output = (input - 1500) * 500 / 512
          if (channelValue < 988) channelValue = 988;
          if (channelValue > 2012) channelValue = 2012;
          return (channelValue - 1500) ;//* 500 / 512;
        };
        
        // 获取当前选择的通道的实时输入数据
        const getCurrentChannelInput = () => {
          const channelSelect = document.getElementById('expo-channel-select');
          if (!channelSelect) return null;
          
          const selectedChannel = parseInt(channelSelect.value, 10);
          
          // 获取原始通道数据

        const getChangeCurrentChannelInput = () => {

          const rawValue = changeChannelData[inputChannelIdx];
          return convertChannelToInput(rawValue);
        };


        
        // Expo平滑算法图表绘制函数
        const drawExpoGraph = () => {
          const canvas = document.getElementById('expo-graph-canvas');
          if (!canvas) return;
          
          const ctx = canvas.getContext('2d');
          const width = canvas.width;
          const height = canvas.height;
          const padding = 50; // 边距
          const graphWidth = width - 2 * padding;
          const graphHeight = height - 2 * padding;
          const centerX = padding + graphWidth / 2;
          const centerY = padding + graphHeight / 2;
          const xRange = 200; // -100 到 100
          const yRange = 200; // -100 到 100
          const scaleX = graphWidth / xRange;
          const scaleY = graphHeight / yRange;
          
          // 清空画布
          ctx.clearRect(0, 0, width, height);
          
          // 绘制背景网格
          ctx.strokeStyle = '#e0e7ff';
          ctx.lineWidth = 1;
          // 垂直网格线（每10个单位）
          for (let i = -100; i <= 100; i += 10) {
            const x = centerX + i * scaleX;
            ctx.beginPath();
            ctx.moveTo(x, padding);
            ctx.lineTo(x, height - padding);
            ctx.stroke();
          }
          // 水平网格线（每10个单位）
          for (let i = -100; i <= 100; i += 10) {
            const y = centerY - i * scaleY;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(width - padding, y);
            ctx.stroke();
          }
          
          // 绘制坐标轴
          ctx.strokeStyle = '#3358e0';
          ctx.lineWidth = 2;
          // X轴
          ctx.beginPath();
          ctx.moveTo(padding, centerY);
          ctx.lineTo(width - padding, centerY);
          ctx.stroke();
          // Y轴
          ctx.beginPath();
          ctx.moveTo(centerX, padding);
          ctx.lineTo(centerX, height - padding);
          ctx.stroke();
          
          // 绘制刻度标签
          ctx.fillStyle = '#3358e0';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          // X轴刻度
          for (let i = -100; i <= 100; i += 10) {
            const x = centerX + i * scaleX;
            ctx.beginPath();
            ctx.moveTo(x, centerY - 5);
            ctx.lineTo(x, centerY + 5);
            ctx.stroke();
            if (i !== 0) {
              ctx.fillText(i.toString(), x, centerY + 8);
            }
          }
          // Y轴刻度
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (let i = -100; i <= 100; i += 10) {
            const y = centerY - i * scaleY;
            ctx.beginPath();
            ctx.moveTo(centerX - 5, y);
            ctx.lineTo(centerX + 5, y);
            ctx.stroke();
            if (i !== 0) {
              ctx.fillText(i.toString(), centerX - 8, y);
            }
          }
          
          // 获取当前参数值（左右两套参数）
          const kInputLeft = document.getElementById('k-input-left');
          const expoInputLeft = document.getElementById('expo-input-left');
          const kInputRight = document.getElementById('k-input-right');
          const expoInputRight = document.getElementById('expo-input-right');
          const switchChannelSelect = document.getElementById('expo-switch-channel-select');
          
          if (!kInputLeft || !expoInputLeft || !kInputRight || !expoInputRight) {
            console.log('Expo graph: Missing input elements');
            return;
          }
          
          const kLeft = (parseFloat(kInputLeft.value) || 0) / 100; // 左侧Rate值从-100到100，除以100得到-1到1
          const expoLeft = parseFloat(expoInputLeft.value) || 0; // 左侧Expo值 -100到100
          const kRight = (parseFloat(kInputRight.value) || 0) / 100; // 右侧Rate值从-100到100，除以100得到-1到1
          const expoRight = parseFloat(expoInputRight.value) || 0; // 右侧Expo值 -100到100
          
          // 获取开关通道索引（用于模拟，实际应该从设备读取该通道的值）
          const switchChannelIdx = switchChannelSelect ? parseInt(switchChannelSelect.value) : 0;
          
          // 绘制分段函数曲线
          // 根据开关通道的值来决定使用左边还是右边的参数
          // 假设开关通道值 < 0 使用左侧参数，>= 0 使用右侧参数
          ctx.strokeStyle = '#e74c3c';
          ctx.lineWidth = 3;
          ctx.beginPath();
          let firstPoint = true;
          
          for (let x = -100; x <= 100; x += 0.5) {
            // 根据x值判断使用哪套参数（这里用x的正负来模拟开关通道的值）
            // 实际应用中，应该根据开关通道的实时值来判断
            let k, expo;
            if (x < 0) {
              // 使用左侧参数
              k = kLeft;
              expo = expoLeft;
            } else {
              // 使用右侧参数（包括x=0）
              k = kRight;
              expo = expoRight;
            }
            
            // 先应用expo平滑算法（使用立方方程: y = k*x + (1-k)*x^3）
            // expo范围: -100到100, 0是线性
            // 负expo: 中心平缓，边缘陡峭（立方项占主导，k小）
            // 正expo: 中心陡峭，边缘平缓（线性项占主导，k大）
            let y = x;
            if (Math.abs(expo) > 0.001) {
              // 归一化输入到-1到1范围
              const normalizedX = x / 100;
              const sign = normalizedX >= 0 ? 1 : -1;
              const absX = Math.abs(normalizedX);
              const clampedAbsX = Math.min(1, absX);
              
              // 根据C代码逻辑计算k因子
              // C代码中: expo_norm = _expo + 100 (0到200)
              //          k = expo_norm (如果 <= 100) 或 200 - expo_norm (如果 > 100)
              // 但C代码对正expo有特殊处理: x -= 500, 计算后 y += 500
              // 这实际上是为了实现正expo的效果
              const expoNorm = expo + 100; // 0到200
              let kFactor;
              
              if (expoNorm <= 100) {
                // 负expo: k = expo_norm / 100, 范围从0到1
                // k小 -> 立方项占主导 -> 中心平缓
                kFactor = expoNorm / 100; // 0到1
                
                // 负expo的通用计算
                const linearTerm = kFactor * clampedAbsX;
                const cubicTerm = (1 - kFactor) * clampedAbsX * clampedAbsX * clampedAbsX;
                const expoAbsY = linearTerm + cubicTerm;
                
                // 限制输出在0到1之间
                const clampedExpoAbsY = Math.max(0, Math.min(1, expoAbsY));
                
                // 恢复符号并还原到-100到100范围
                const normalizedY = sign * clampedExpoAbsY;
                y = normalizedY * 100;
              } else {
                // 正expo: 中心陡峭，边缘平缓
                // 严格按照C代码逻辑实现
                // C代码: k = (200 - expo_norm) / 100, 然后 x -= 500, 计算, y += 500
                const kNorm = 200 - expoNorm; // 100到0
                kFactor = kNorm / 100; // 1到0
                
                // C代码中对于正expo的处理：
                // 1. x -= 500: 将输入从 [0,500] 映射到 [-500,0]
                // 2. 使用绝对值计算立方公式
                // 3. y += 500: 将输出映射回 [0,500]
                // 
                // 在归一化空间中：
                // 输入 clampedAbsX 是 [0,1]
                // 偏移后相当于使用 1 - clampedAbsX 作为计算输入（从1到0）
                // 计算后结果需要映射回 [0,1]
                const reversedX = 1 - clampedAbsX; // 1到0
                
                // 使用反转后的x计算立方公式
                // 注意：kFactor 范围是 [0, 1]，reversedX 范围是 [0, 1]
                const linearTerm = kFactor * reversedX;
                const cubicTerm = (1 - kFactor) * reversedX * reversedX * reversedX;
                const calcY = linearTerm + cubicTerm;
                
                // calcY 的值域分析：
                // - 当 reversedX = 1 (输入 clampedAbsX = 0) 时：calcY = kFactor + (1-kFactor) = 1
                // - 当 reversedX = 0 (输入 clampedAbsX = 1) 时：calcY = 0
                // - calcY 在 [0, 1] 范围内，但方向与输入相反
                // 
                // 由于输入反转了，输出也需要反转回来
                // expoAbsY = 1 - calcY 确保：
                // - 输入0 -> calcY=1 -> expoAbsY=0 ✓
                // - 输入1 -> calcY=0 -> expoAbsY=1 ✓
                let expoAbsY = 1 - calcY;
                
                // 确保 expoAbsY 在 [0, 1] 范围内（理论上应该在范围内，但防止数值误差）
                expoAbsY = Math.max(0, Math.min(1, expoAbsY));
                
                const clampedExpoAbsY = expoAbsY;
                
                // 恢复符号并还原到-100到100范围
                const normalizedY = sign * clampedExpoAbsY;
                y = normalizedY * 100;
              }
            }
            
            // 然后应用k斜率
            y = k * y;
            // 确保y在有效范围内
            y = Math.max(-100, Math.min(100, y));
            const px = centerX + x * scaleX;
            const py = centerY - y * scaleY;
            if (firstPoint) {
              ctx.moveTo(px, py);
              firstPoint = false;
            } else {
              ctx.lineTo(px, py);
            }
          }
          ctx.stroke();
          
          // 绘制测试点（如果存在）
          const testXInput = document.getElementById('expo-test-x');
          const testCoordDisplay = document.getElementById('expo-test-coord');
          if (testXInput && testCoordDisplay) {
            const testX = parseFloat(testXInput.value);
            if (!isNaN(testX) && testX >= -100 && testX <= 100) {
              // 计算测试点的 y 值（使用相同的逻辑）
              let k, expo;
              if (testX < 0) {
                k = kLeft;
                expo = expoLeft;
              } else {
                k = kRight;
                expo = expoRight;
              }
              
              // 应用expo算法计算y值
              let testY = testX;
              if (Math.abs(expo) > 0.001) {
                const normalizedX = testX / 100;
                const sign = normalizedX >= 0 ? 1 : -1;
                const absX = Math.abs(normalizedX);
                const clampedAbsX = Math.min(1, absX);
                
                const expoNorm = expo + 100;
                let kFactor;
                
                if (expoNorm <= 100) {
                  kFactor = expoNorm / 100;
                  const linearTerm = kFactor * clampedAbsX;
                  const cubicTerm = (1 - kFactor) * clampedAbsX * clampedAbsX * clampedAbsX;
                  const expoAbsY = linearTerm + cubicTerm;
                  const clampedExpoAbsY = Math.max(0, Math.min(1, expoAbsY));
                  const normalizedY = sign * clampedExpoAbsY;
                  testY = normalizedY * 100;
                } else {
                  const kNorm = 200 - expoNorm;
                  kFactor = kNorm / 100;
                  const reversedX = 1 - clampedAbsX;
                  const linearTerm = kFactor * reversedX;
                  const cubicTerm = (1 - kFactor) * reversedX * reversedX * reversedX;
                  const calcY = linearTerm + cubicTerm;
                  let expoAbsY = 1 - calcY;
                  expoAbsY = Math.max(0, Math.min(1, expoAbsY));
                  const normalizedY = sign * expoAbsY;
                  testY = normalizedY * 100;
                }
              }
              
              // 应用k斜率
              testY = k * testY;
              testY = Math.max(-100, Math.min(100, testY));
              
              // 更新坐标显示
              testCoordDisplay.textContent = `(${testX.toFixed(1)}, ${testY.toFixed(2)})`;
              
              // 绘制测试点
              const testPx = centerX + testX * scaleX;
              const testPy = centerY - testY * scaleY;
              
              // 绘制垂直x轴的虚线
              ctx.strokeStyle = '#e74c3c';
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              ctx.beginPath();
              ctx.moveTo(testPx, padding);
              ctx.lineTo(testPx, height - padding);
              ctx.stroke();
              
              // 绘制垂直y轴的虚线
              ctx.beginPath();
              ctx.moveTo(padding, testPy);
              ctx.lineTo(width - padding, testPy);
              ctx.stroke();
              ctx.setLineDash([]);
              
              // 绘制测试点（红色圆点）
              ctx.fillStyle = '#e74c3c';
              ctx.beginPath();
              ctx.arc(testPx, testPy, 6, 0, 2 * Math.PI);
              ctx.fill();
              
              // 绘制测试点的白色边框
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(testPx, testPy, 6, 0, 2 * Math.PI);
              ctx.stroke();
            } else if (testCoordDisplay) {
              testCoordDisplay.textContent = '(无效输入)';
            }
          }
          
          // 绘制分段点（x=0处）
          ctx.strokeStyle = '#999';
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(centerX, padding);
          ctx.lineTo(centerX, height - padding);
          ctx.stroke();
          ctx.setLineDash([]);
          
          const legendSeg = (LANGS[currentLang] && LANGS[currentLang]['expo-legend-segment']) || '分段函数曲线';
          const legendReal = (LANGS[currentLang] && LANGS[currentLang]['expo-legend-real']) || '实际坐标输入';
          const legendTest = (LANGS[currentLang] && LANGS[currentLang]['expo-legend-test']) || '测试输入';
          ctx.font = '12px Arial';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(width - padding - 130, padding + 8, 15, 2);
          ctx.fillStyle = '#222';
          ctx.fillText(legendSeg, width - padding - 110, padding + 3);
          ctx.fillStyle = '#27ae60';
          ctx.beginPath();
          ctx.arc(width - padding - 122, padding + 28, 5, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = '#222';
          ctx.fillText(legendReal, width - padding - 110, padding + 23);
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(width - padding - 122, padding + 48, 5, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = '#222';
          ctx.fillText(legendTest, width - padding - 110, padding + 43);
          
          // 绘制实时输入数据点（原始/输出数据源由全局切换决定）
          const realTimeInput = window._channelDataSourceRaw == 1
            ? getCurrentChannelInput()
            : getChangeCurrentChannelInput();
          if (realTimeInput !== null) {
            // 将输入值从-500到500转换为-100到100（图表范围）
            const normalizedInput = realTimeInput / 5; // -500到500 -> -100到100
            
            // 计算对应的输出值（使用当前参数）
            const channelSelect = document.getElementById('expo-channel-select');
            const selectedChannel = channelSelect ? parseInt(channelSelect.value) : 0;
            
            let k, expo;
            if (normalizedInput < 0) {
              const kInputLeft = document.getElementById('k-input-left');
              const expoInputLeft = document.getElementById('expo-input-left');
              k = (parseFloat(kInputLeft?.value) || 0) / 100;
              expo = parseFloat(expoInputLeft?.value) || 0;
            } else {
              const kInputRight = document.getElementById('k-input-right');
              const expoInputRight = document.getElementById('expo-input-right');
              k = (parseFloat(kInputRight?.value) || 0) / 100;
              expo = parseFloat(expoInputRight?.value) || 0;
            }
            
            // 应用expo算法计算输出
            let outputY = normalizedInput;
            if (Math.abs(expo) > 0.001) {
              const normalizedX = normalizedInput / 100;
              const sign = normalizedX >= 0 ? 1 : -1;
              const absX = Math.abs(normalizedX);
              const clampedAbsX = Math.min(1, absX);
              
              const expoNorm = expo + 100;
              let kFactor;
              
              if (expoNorm <= 100) {
                kFactor = expoNorm / 100;
                const linearTerm = kFactor * clampedAbsX;
                const cubicTerm = (1 - kFactor) * clampedAbsX * clampedAbsX * clampedAbsX;
                const expoAbsY = linearTerm + cubicTerm;
                const clampedExpoAbsY = Math.max(0, Math.min(1, expoAbsY));
                const normalizedY = sign * clampedExpoAbsY;
                outputY = normalizedY * 100;
              } else {
                const kNorm = 200 - expoNorm;
                kFactor = kNorm / 100;
                const reversedX = 1 - clampedAbsX;
                const linearTerm = kFactor * reversedX;
                const cubicTerm = (1 - kFactor) * reversedX * reversedX * reversedX;
                const calcY = linearTerm + cubicTerm;
                let expoAbsY = 1 - calcY;
                expoAbsY = Math.max(0, Math.min(1, expoAbsY));
                const normalizedY = sign * expoAbsY;
                outputY = normalizedY * 100;
              }
            }
            
            // 应用rate
            outputY = k * outputY;
            outputY = Math.max(-100, Math.min(100, outputY));
            
            // 绘制实时输入点
            const realTimePx = centerX + normalizedInput * scaleX;
            const realTimePy = centerY - outputY * scaleY;
            
            // 绘制垂直x轴的虚线（绿色，表示实时输入）
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(realTimePx, padding);
            ctx.lineTo(realTimePx, height - padding);
            ctx.stroke();
            
            // 绘制垂直y轴的虚线
            ctx.beginPath();
            ctx.moveTo(padding, realTimePy);
            ctx.lineTo(width - padding, realTimePy);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 绘制实时输入点（绿色圆点）
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.arc(realTimePx, realTimePy, 8, 0, 2 * Math.PI);
            ctx.fill();
            
            // 绘制白色边框
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(realTimePx, realTimePy, 8, 0, 2 * Math.PI);
            ctx.stroke();
            
            const realCoordDisplay = document.getElementById('expo-real-coord');
            if (realCoordDisplay) {
              realCoordDisplay.textContent = `(${normalizedInput.toFixed(1)}, ${outputY.toFixed(2)})`;
            }

        function updateFlightModeOutputs() {
          // 获取当前模式
          const currentMode = document.querySelector('input[name="flight-type"]:checked')?.value;
          if (!currentMode || currentMode === 'none') return;

          // 获取原始通道数据
          if (!window.origChannelData || window.origChannelData.length < 4) {
            return;
          }

          // // 获取通道映射
          // const channelMapSend = (window.channelMap && window.channelMap.channelMapSend)
          //   ? window.channelMap.channelMapSend
          //   : Array.from({length:10}, (_,i)=>i+1);

          // // 根据map找到AIL/ELE/THR/RUD对应的输入通道索引
          // // AIL=1, ELE=2, THR=3, RUD=4
          // let ailIdx = -1, eleIdx = -1, thrIdx = -1, rudIdx = -1;
          // for (let i = 0; i < channelMapSend.length; i++) {
          //   if (channelMapSend[i] === 1) ailIdx = i;
          //   if (channelMapSend[i] === 2) eleIdx = i;
          //   if (channelMapSend[i] === 3) thrIdx = i;
          //   if (channelMapSend[i] === 4) rudIdx = i;
          // }

          // // 获取输入通道值
          // const ele = (eleIdx >= 0) ? window.origChannelData[eleIdx] : 1500;
          // const rud = (rudIdx >= 0) ? window.origChannelData[rudIdx] : 1500;
          // const ail = (ailIdx >= 0) ? window.origChannelData[ailIdx] : 1500;\

          // 使用当前操作模式的物理映射来获取正确的通道索引
          const currentModeIdx = window._currentModeIdx || 0;
          let ailLogicalCh = getPhysicalChannelForFunction(0, currentModeIdx);  // AIL=0, 获取AIL在当前模式下的物理通道
          let eleLogicalCh = getPhysicalChannelForFunction(1, currentModeIdx);  // ELE=1
          let rudLogicalCh = getPhysicalChannelForFunction(3, currentModeIdx);  // RUD=3

          const mixSrc = window._channelDataSourceRaw == 1 ? window.origChannelData : changeChannelData;
          // const ele = (mixSrc && mixSrc[1]) || 1500;
          // const rud = (mixSrc && mixSrc[3]) || 1500;
          // const ail = (mixSrc && mixSrc[0]) || 1500;
          // 从物理通道索引获取通道值，如果索引无效则使用默认值1500
          const ele = (eleLogicalCh >= 0 && eleLogicalCh < mixSrc.length) ? mixSrc[eleLogicalCh] : 1500;  // M4: mixSrc[1] = CH2的ELE值
          const rud = (rudLogicalCh >= 0 && rudLogicalCh < mixSrc.length) ? mixSrc[rudLogicalCh] : 1500;  // M4: mixSrc[2] = CH3的RUD值
          const ail = (ailLogicalCh >= 0 && ailLogicalCh < mixSrc.length) ? mixSrc[ailLogicalCh] : 1500;  // M4: mixSrc[3] = CH4的AIL值

          // 转换为-100到100范围
          const eleNorm = ((ele - 1500) / 5);
          const rudNorm = ((rud - 1500) / 5);
          const ailNorm = ((ail - 1500) / 5);
          
          // 限制范围
          const eleClamped = Math.max(-100, Math.min(100, eleNorm));
          const rudClamped = Math.max(-100, Math.min(100, rudNorm));
          const ailClamped = Math.max(-100, Math.min(100, ailNorm));
          
          // 计算左右输出
          let leftOutput = 0;
          let rightOutput = 0;
          
          if (currentMode === 'vtail') {
            // V尾混控：左 = ELE + RUD, 右 = ELE - RUD
            leftOutput = eleClamped + rudClamped;
            rightOutput = eleClamped - rudClamped;
          } else if (currentMode === 'delta') {
            // 三角翼混控：左 = ELE + AIL, 右 = ELE - AIL
            leftOutput = eleClamped + ailClamped;
            rightOutput = eleClamped - ailClamped;
          }
          
          // 限制输出范围
          leftOutput = Math.max(-100, Math.min(100, leftOutput));
          rightOutput = Math.max(-100, Math.min(100, rightOutput));
          
          // 更新UI显示

          const rightVal = document.getElementById('right-output-val');
          const leftBar = document.getElementById('left-output-bar');
          const rightBar = document.getElementById('right-output-bar');
          const inputEle = document.getElementById('input-ele');
          const inputRud = document.getElementById('input-rud');
          const inputAil = document.getElementById('input-ail');
          
          if (leftVal) leftVal.textContent = Math.round(leftOutput);
          if (rightVal) rightVal.textContent = Math.round(rightOutput);
          if (leftBar) leftBar.style.width = (50 + leftOutput / 2) + '%';
          if (rightBar) rightBar.style.width = (50 + rightOutput / 2) + '%';
          if (inputEle) inputEle.textContent = Math.round(eleClamped);
          if (inputRud) inputRud.textContent = Math.round(rudClamped);
          if (inputAil) inputAil.textContent = Math.round(ailClamped);
          
          // 更新飞机动画线条
          updatePlaneAnimation(currentMode, leftOutput, rightOutput);
        }

      //console.log('[ATTR] 自动发送设备属性指令');
      if (!writer || !isSerialConnected) return;
      if (_autoDevAttrTries >= _autoDevAttrMaxTries) return;
      _autoDevAttrTries++;
      const devAttrCmd = new Uint8Array([0xA5, 0x55, 0x1D, 0x0D, 0x0A]);
      if (!(await safeSerialWrite(devAttrCmd))) return;
      // 等待2秒，如果window._deviceInfo还没被赋值则重试
      _autoDevAttrTimer = setTimeout(() => {
        if (!window._deviceInfo && _autoDevAttrTries < _autoDevAttrMaxTries) {
          autoSendDevAttr();
        } else if (!window._deviceInfo && _autoDevAttrTries >= _autoDevAttrMaxTries) {
          // 失败，显示按钮
          //renderDeviceInfoPage();
        }
      }, 2000);
    }

      if (upDataFlag !== 1 && typeof window.stopFwReadyCheck === 'function') {
        window.stopFwReadyCheck('serial reconnect');
      } else if (upDataFlag === 1) {
        console.log('[FW] 正在固件更新流程中，不调用stopFwReadyCheck');
      }
      serialBuffer = [];
      window._deviceInfo = undefined;

      if (isMT6DeviceName(devName)) return { start: 0, end: 6 };

    function logChannelMap(stage, extra) {

      const range = getChannelMapSelectRange();
      const payload = {

        device: dev,
        selectRange: `ch-map-in2-${range.start}..${range.end - 1}`,

      if (cm) {
        payload.channelMapNum = cm.channelMapNum;
        payload.channelMapSend = cm.channelMapSend ? Array.from(cm.channelMapSend) : null;
        payload.channelMapRecv = cm.channelMapRecv ? Array.from(cm.channelMapRecv) : null;
        if (isMT8DeviceName(dev)) {

    function buildChannelConfigPacket(map, dir, left, right, mode) {
      const tmpData = new Uint8Array(58);
      tmpData[0] = 0xA5;
      tmpData[1] = 0x55;
      tmpData[2] = 0x0C;
      tmpData[3] = 52;
      for (let i = 0; i < 16; i++) tmpData[4 + i] = map[i] || 0;
      let tmpData1 = 0;
      for (let i = 0; i < 16; i++) if (dir[i]) tmpData1 |= (1 << i);
      tmpData[20] = (tmpData1 >> 8) & 0xFF;
      tmpData[21] = tmpData1 & 0xFF;
      for (let i = 0; i < 16; i++) tmpData[22 + i] = left[i] || 0;
      for (let i = 0; i < 16; i++) tmpData[38 + i] = right[i] || 0;
      if (mode < 1) mode = 1;
      if (mode > 4) mode = 4;
      tmpData[54] = mode;
      tmpData[55] = crc8tab_js(tmpData.slice(3, 55), 52);
      tmpData[56] = 0x0D;
      tmpData[57] = 0x0A;
      return tmpData;
    }

      });
    }

    async function requestChannelMap() {
      if (!writer) return;
      if (_channelMapSuccess) return;
      if (_channelMapTries >= _channelMapMaxTries) {
        showChannelMapRefreshBtn();
        return;
      }
      _channelMapTries++;
      // 发送请求
      const buf = new Uint8Array([0xA5,0x55,0x0D,0,0,0x0D,0x0A]);
      await writer.write(buf);
      // 2秒后检查是否成功
      _channelMapTimer = setTimeout(() => {
        if (!_channelMapSuccess) requestChannelMap();
      }, 2000);

    // 进入设备配置页面时自动请求
    const _orig_showMainPage2 = showMainPage;
    showMainPage = function(page) {
      _orig_showMainPage2.apply(this, arguments);
      if (page === 'config') {
        _channelMapTries = 0;

    // ========== 0x44包解析，自动切换操作模式 ========== //
    // 新增全局标志，控制trim/center指令发送
    let _waitingForTrimAndMid = false;
    function tryParseChannelMapPacket(buf) {
      //console.log('tryParseChannelMapPacket Running', buf);
      if (!buf || buf.length < 3) return false;
      if (buf[0] !== 0x44) return false;
      const len = buf[1];
      if (buf.length < len + 2) return false;
      const crc = buf[len+1];
      // CRC8校验
      const calcCrc = crc8tab_js(buf.slice(2,2+len-1), len-1);
      if (crc !== calcCrc) return false;
      // 构造channelMap对象
      channelMap = {
        channelMapNum: buf[52],
        ctlModeRecv: buf[53],
        channelMapRecv: Array.from(buf.slice(2,18)),
        channelMapSend: Array.from(buf.slice(2,18)),
        channelLeftRecv: Array.from(buf.slice(18,34)),
        channelLeftSend: Array.from(buf.slice(18,34)),
        channelRightRecv: Array.from(buf.slice(34,50)),
        channelRightSend: Array.from(buf.slice(34,50)),
        channelDirRecv: [],
        channelDirSend: [],
        channelMidRecv: [0,0,0,0],
        channelMidSend: [0,0,0,0],
        channelTrimRecv: [0,0,0,0],
        channelTrimSend: [0,0,0,0]
      };
      // channelDirRecv: 16位bit
      let dirWord = buf[50] | (buf[51]<<8);
      for(let i=0;i<16;i++){
        channelMap.channelDirRecv[i] = (dirWord & (1<<i)) ? 1 : 0;
        channelMap.channelDirSend[i] = channelMap.channelDirRecv[i];
      }
      // 页面center/trim全设为0
      for(let i=0;i<4;i++){
        let centerInput = document.getElementById(`center-input-${i}`);
        let centerValSpan = document.getElementById(`center-val-${i}`);
        if(centerInput) centerInput.value = 0;
        if(centerValSpan) centerValSpan.textContent = 0;
        let centerDot = document.getElementById(`center-dot-${i}`);
        let centerBar = document.getElementById(`center-bar-${i}`);
        if(centerDot && centerBar) {
          let percent = (0 + 100) / 200; // 0值时的百分比
          let left = percent * (centerBar.offsetWidth - centerDot.offsetWidth);
          centerDot.style.left = left + 'px';
        }
        let trimInput = document.getElementById(`trim-input-${i}`);
        let trimValSpan = document.getElementById(`trim-val-${i}`);
        if(trimInput) trimInput.value = 0;
        if(trimValSpan) trimValSpan.textContent = 0;
        let trimDot = document.getElementById(`trim-dot-${i}`);
        let trimBar = document.getElementById(`trim-bar-${i}`);
        if(trimDot && trimBar) {
          let percent = (0 + 130) / 260; // 0值时的百分比
          let left = percent * (trimBar.offsetWidth - trimDot.offsetWidth);
          trimDot.style.left = left + 'px';
        }
        
      }
      window.channelMap = channelMap;
      logChannelMap('RX-0x44', {
        rawMapBytes: Array.from(buf.slice(2, 18)),
        dirWord: dirWord,
        ctlMode: buf[53],
        crcOk: true,
      });
      //console.log('tryParseChannelMapPacket Running over');
      // 自动切换操作模式
      if (typeof channelMap.ctlModeRecv === 'number') {
        let modeIdx = 1; // 默认M2
        if (channelMap.ctlModeRecv === 1) modeIdx = 0;
        else if (channelMap.ctlModeRecv === 2) modeIdx = 1;
        else if (channelMap.ctlModeRecv === 3) modeIdx = 2;
        else if (channelMap.ctlModeRecv === 4) modeIdx = 3;
        window._currentModeIdx = modeIdx;
        // 切换下拉框
      setTimeout(() => {
          const sel = document.getElementById('mode-select');
          if (sel) sel.value = modeIdx;
          // 触发一次change以刷新UI
          if (sel) sel.dispatchEvent(new Event('change'));
        }, 0);
      }
      // 只在收到0x44包后再发0x12包（避免并发/粘包问题）
      if (typeof writer !== 'undefined' && writer && !_waitingForTrimAndMid) {
        _waitingForTrimAndMid = true;
        const cmd = new Uint8Array([0xA5,0x55,0x1F,0x0D,0x0A]);
        writer.write(cmd);
        console.log('已发送获取trim和中心点指令: [0xA5,0x55,0x1F,0x0D,0x0A]');
      }
      // 设备配置页面流程切换
      if (typeof window._onConfigMapReceived === 'function') {
        window._onConfigMapReceived();
        window._onConfigMapReceived = null;
      }
      if (typeof window._onCalibMapReceived === 'function') {
        window._onCalibMapReceived();
        window._onCalibMapReceived = null;
      }

      syncChannelMapSelectsFromMemory();

      return channelMap;
    }
    // 在tryParseTrimAndMidPacket里收到包后，重置标志
    function tryParseTrimAndMidPacket(buf) {
      //console.log('tryParseTrimAndMidPacket Running', buf);
      if (!buf || buf.length < 3) return false;
      if (buf[0] !== 0x12) return false;
      const len = buf[1];
      if (buf.length < len + 2 || len < 10) return false;
      const crc = buf[len+1];
      const calcCrc = crc8tab_js(buf.slice(2,2+len-1), len-1);
      if (crc !== calcCrc) return false;
      // 解析中立点
      let channelMidRecv = [], channelMidSend = [], channelTrimRecv = [], channelTrimSend = [];
      for(let i=0;i<4;i++){
        let off = 2 + i*2;
        let val = buf[off] | (buf[off+1]<<8);
        if(val & 0x8000) val = val - 0x10000;
        channelMidRecv[i] = val;
        channelMidSend[i] = val;
        let centerVal = Math.round(val * 100 / 512);
        let centerInput = document.getElementById(`center-input-${i}`);
        let centerValSpan = document.getElementById(`center-val-${i}`);
        if(centerInput) centerInput.value = centerVal;
        if(centerValSpan) centerValSpan.textContent = centerVal;
        let centerDot = document.getElementById(`center-dot-${i}`);
        let centerBar = document.getElementById(`center-bar-${i}`);
        if(centerDot && centerBar) {
          let percent = (centerVal + 100) / 200; // center范围-100�?00
          let left = percent * (centerBar.offsetWidth - centerDot.offsetWidth);
          centerDot.style.left = left + 'px';
        }
      }
      // 解析trim
      for(let i=0;i<4;i++){
        let off = 2 + 8 + i*2;
        let val = buf[off] | (buf[off+1]<<8);
        if(val & 0x8000) val = val - 0x10000;
        channelTrimRecv[i] = val;
        channelTrimSend[i] = val;
        let trimInput = document.getElementById(`trim-input-${i}`);
        let trimValSpan = document.getElementById(`trim-val-${i}`);
        if(trimInput) trimInput.value = val;
        if(trimValSpan) trimValSpan.textContent = val;
        let trimDot = document.getElementById(`trim-dot-${i}`);
        let trimBar = document.getElementById(`trim-bar-${i}`);
        if(trimDot && trimBar) {
          let percent = (val + 130) / 260; // trim范围-130�?30
          let left = percent * (trimBar.offsetWidth - trimDot.offsetWidth);
          trimDot.style.left = left + 'px';
        }


      }
      // 全局唯一：直接赋值到window.channelMap
      if (window.channelMap) {
        window.channelMap.channelMidRecv = channelMidRecv;
        window.channelMap.channelMidSend = channelMidSend;
        window.channelMap.channelTrimSend = channelTrimSend;
        window.channelMap.channelTrimRecv = channelTrimRecv;
      }


      // 移除window.trimMidObj = trimMidObj;
      //console.log('trimMidObj:', { channelMidRecv, channelMidSend, channelTrimRecv, channelTrimSend });
      _hasTrimAndMid = true;
      // 收到trim/center包后，允许下次0x44包再发0x12
      _waitingForTrimAndMid = false;
      // 启动原始通道数据定时器（只启动一次）
      // if (!_origChannelTimer && typeof writer !== 'undefined' && writer &&
      //   document.getElementById('page-config') &&
      //   document.getElementById('page-config').style.display !== 'none'
      // ) {
      //   _origChannelTimer = setInterval(() => {
      //     writer.write(new Uint8Array([0xA5,0x55,0x02,0x0D,0x0A]));
      //   }, 20);
      //   window._pageTasks.intervals.push(_origChannelTimer); // 统一管理
      //   console.log('已启动原始通道数据定时器，每20ms发送一次[0xA5,0x55,0x02,0x0D,0x0A]');
      // }
      // 设备配置页面流程切换
      if (typeof window._onConfigTrimReceived === 'function') {
        window._onConfigTrimReceived();
        window._onConfigTrimReceived = null;
      }
      return { channelMidRecv, channelMidSend, channelTrimRecv, channelTrimSend };
    }

    // 解析0x22包，显示原始通道数据
    function tryParseOrigChannelPacket(buf) {
      //console.log('tryParseOrigChannelPacket Running', buf);
      if (!buf || buf.length < 3) return false;
      if (buf[0] !== 0x22) return false;
      const len = buf[1];
      if (buf.length < len + 2) return false;
      const crc = buf[len+1];
      const calcCrc = crc8tab_js(buf.slice(2,2+len-1), len-1);
      if (crc !== calcCrc) return false;
      // 解析原始通道数据
      let recvChannel = [];
      for(let i=0;i<10;i++){
        let off = 8 + i*2;
        let val = buf[off] | (buf[off+1]<<8);
        recvChannel[i] = val;
      }
      
      //console.log('tryParseOrigChannelPacket Running', buf);
      // ========== 新增：通道数据处理算法 ==========
      let channlMinRoute = 988;
      let channlMaxRoute = 2012;
      let channlMidRoute = 1500;
      let processedCH = new Array(10);
      // 获取映射、反向、行程、中心点、Trim参数
      let channelMapSend = (window.channelMap && window.channelMap.channelMapSend) ? window.channelMap.channelMapSend : Array.from({length:10}, (_,i)=>i+1);
      let channelDirSend = (window.channelMap && window.channelMap.channelDirSend) ? window.channelMap.channelDirSend : Array(10).fill(0);
      let routeLeft = (window.channelMap && window.channelMap.channelLeftSend) ? window.channelMap.channelLeftSend : Array(10).fill(0);
      let routeRight = (window.channelMap && window.channelMap.channelRightSend) ? window.channelMap.channelRightSend : Array(10).fill(0);
      let centerVal = (window.channelMap && window.channelMap.channelMidSend) ? window.channelMap.channelMidSend : Array(4).fill(0);
      let trimVal = (window.channelMap && window.channelMap.channelTrimSend) ? window.channelMap.channelTrimSend : Array(4).fill(0);
      // 1. 先中心点+行程，再Trim，再映射，最后反向
      let tmpRouteData = new Array(10);
      for(let i = 0; i < 10; i++)
      {
        tmpRouteData[i] = recvChannel[window.channelMap.channelMapSend[i]-1];
      }
      
        for (let i = 0; i < 10; i++) {
        // 先中心点+行程
        let raw = tmpRouteData[i];
        let midOffset = (i < 4) ? (centerVal[window.channelMap.channelMapSend[i]-1] || 0) : 0;
        let leftPercent = routeLeft[i] || 0;
        let rightPercent = routeRight[i] || 0;
        if (raw >= channlMidRoute) {
          tmpRouteData[i] = ((raw - channlMidRoute) * (channlMaxRoute - channlMidRoute - midOffset) / (channlMaxRoute - channlMidRoute)) * (100 - rightPercent) / 100 + channlMidRoute + midOffset;
        } else {
          tmpRouteData[i] = (-1 * (channlMidRoute - raw) * (channlMidRoute + midOffset - channlMinRoute) / (channlMidRoute - channlMinRoute)) * (100 - leftPercent) / 100 + channlMidRoute + midOffset;
        }
        // 再Trim（仅前4个）
        if (i < 4) {
          let handOffset = trimVal[window.channelMap.channelMapSend[i]-1] || 0;
          if (handOffset > 0) {
            if (tmpRouteData[i] + handOffset > channlMaxRoute) {
              tmpRouteData[i] = channlMaxRoute;
            } else {
              tmpRouteData[i] = tmpRouteData[i] + handOffset;
            }
          } else if (handOffset < 0) {
            if (tmpRouteData[i] + handOffset < channlMinRoute) {
              tmpRouteData[i] = channlMinRoute;
            } else {
              tmpRouteData[i] = tmpRouteData[i] + handOffset;
            }
          }
        }
      }
      // // 再映射
      // let mappedCH = new Array(10);
      // for (let i = 0; i < 10; i++) {
      //   //let srcIdx = (channelMapSend[i] || (i+1)) - 1;
      //   mappedCH[i] = tmpRouteData[i];
      // }
      // 最后反向
      for (let i = 0; i < 10; i++) {
        // if (channelDirSend[i]) {
        //   processedCH[i] = 2 * channlMidRoute - tmpRouteData[i];
        // } else {
          processedCH[i] = tmpRouteData[i];
        // }
        // 边界保护
        if (processedCH[i] > channlMaxRoute) processedCH[i] = channlMaxRoute;
        if (processedCH[i] < channlMinRoute) processedCH[i] = channlMinRoute;
      }
      // ========== 用处理后的数据显示到页面 ==========
      if (processedCH[0] !== 0) {
        const channelCount = window.channelMap ? window.channelMap.channelMapNum : 10;
        for(let i=0;i<channelCount;i++){
          let chVal = document.getElementById(`ch-val-${i}`);
          let chInput = document.getElementById(`ch-input-${i}`);
          if(chVal) chVal.textContent = Math.round(processedCH[i]);
          if(chInput) chInput.value = Math.round(processedCH[i]);
          let bar = document.getElementById(`ch-bar-${i}`)?.children[0];
          if(bar) bar.style.width = ((processedCH[i]-988)/(2012-988)*100) + '%';
          let barAttr = document.getElementById(`ch-bar-attr-${i}`)?.children[0];
          if(barAttr) barAttr.style.width = ((processedCH[i]-988)/(2012-988)*100) + '%';
        }
      }
      window.origChannelData = recvChannel;
      for (let i = 0; i < 10; i++) {
        changeChannelData[i] = processedCH[i];
      }
      // 新增：保存最新原始包
      window._lastOrigChannelBuf = buf;
      //console.log('原始通道数据:', recvChannel);
      return true;
    }


    
    // 在serialBuffer推入数据后，尝试判定0x44/0x12/0x22包并移除数据
    const _orig_serialBufferPush = Array.prototype.push;
    Array.prototype.push = function(...args) {
      //console.log('serialBuffer.push called', args, this);
      const isMt8CalibBuf = this === serialBuffer && window._currentPage === 'calib' &&
        window._deviceInfo && (window._deviceInfo.devName === 'RadioMaster MT8' || window._deviceInfo.devName === 'RadioMaster MT6');
      const bufLenBeforeParse = isMt8CalibBuf ? this.length : 0;
      const ret = _orig_serialBufferPush.apply(this, args);
      if (this === serialBuffer && window.fwReadyCheckActive && window._currentPage === 'fw') {
        return ret;
      }
      if (this === serialBuffer && typeof drainSerialBufferHmiDR === 'function') {
        drainSerialBufferHmiDR();
      }
      const isMt8CalibFlow = isMt8CalibBuf &&
        ['calibratMid', 'calibrating'].includes(window.carCalibState);
      if (isMt8CalibFlow) {
        scheduleMt8CalibSerialParse();
        return ret;
      }
      let found;
      let parseLoop = 0;
      do {
        found = false;
        parseLoop++;
        for (let i = 0; i < this.length - 2; i++) {
          if (this[i] === 0xA5 && this[i + 1] === 0x55 && this[i + 2] === 0x35) {
            if (typeof tryParseLedModePacketAt === 'function' && tryParseLedModePacketAt(this, i)) {
              this.splice(i, 6);
              found = true;
              break;
            }
          }
          // 检查0x44包
          if(window._currentPage !== 'net')
          {
            if (this[i] === 0x44) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                if (tryParseChannelMapPacket(buf)) {
                  _channelMapSuccess = true;
                  hideChannelMapRefreshBtn();
                  if (_channelMapTimer) clearTimeout(_channelMapTimer);
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }

            
            if(this[i] === 0x11){
                const len = this[i+1];
                if (this.length >= i + len + 2 && len >0) {
                  const buf = this.slice(i, i+len+2);
                if (parseDeviceStats(buf)) {
                    this.splice(i, len+2);
                    found = true;
                    break;
                  }
              }
            }


            // 检查0x12包
            if (this[i] === 0x12) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                if (tryParseTrimAndMidPacket(buf)) {
                  //.log('[DEBUG] 0x12包解析成功，准备移除');
                  this.splice(i, len+2);
                  found = true;
                  break;
                } 
              }
            }


            // 检查0x22包   原始数据包
            if (this[i] === 0x22) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = tryParseOrigChannelPacket(buf);
                // 新增：校准页面同步解析
                //console.log('window._currentPage1:', window._currentPage);
                if (window._currentPage === 'calib') {
                  const deviceName = window._deviceInfo ? window._deviceInfo.devName : '';
                  if (isMT8DeviceName(deviceName) && typeof tryParseCarChannelPacket === 'function') {
                    tryParseCarChannelPacket(buf);
                  } else if (typeof tryParseOrigChannelPacketCalib === 'function') {
                    tryParseOrigChannelPacketCalib(buf);
                  }
                }
                if (parsed) {
                  if (isMt8CalibBuf) mt8CalibDbg('BUF-OUT', '消费 0x22 包', { len, remain: this.length - (i + len + 2) });
                  this.splice(i, len+2);
                  found = true;
                  break;
                } else if (isMt8CalibBuf && window._currentPage === 'calib' &&
                    window._deviceInfo && isMT8DeviceName(window._deviceInfo.devName)) {
                  mt8CalibDbg('BUF-STUCK', '0x22 包未能消费(tryParseOrigChannelPacket=false)', {
                    offset: i, len, bufLen: this.length, raw: mt8CalibHex(buf, 24)
                  });
                }
              } else if (isMt8CalibBuf && len > 0) {
                mt8CalibDbg('BUF-WAIT', '0x22 包不完整', { offset: i, len, bufLen: this.length });
              }
            }


            // 检查0xEE包   输出数据包
            if(this[i] === 0xEE) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = tryParseOutputChannelPacket(buf);
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }

            // 检查0x33包
            if (this[i] === 0x33) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if (window._currentPage === 'calib') {
                  const deviceName = window._deviceInfo ? window._deviceInfo.devName : '';
                  if (isMT8DeviceName(deviceName) && typeof tryParseCarAdcPacket === 'function') {
                    parsed = tryParseCarAdcPacket(buf);
                  } else if (typeof tryParseAdcPacketCalib === 'function') {
                    parsed = tryParseAdcPacketCalib(buf);
                  }
                }
                if (parsed) {
                  if (isMt8CalibBuf) mt8CalibDbg('BUF-OUT', '消费 0x33 包', { len, remain: this.length - (i + len + 2) });
                  this.splice(i, len+2);
                  found = true;
                  break;
                } else if (isMt8CalibBuf && window._currentPage === 'calib' &&
                    window._deviceInfo && isMT8DeviceName(window._deviceInfo.devName)) {
                  mt8CalibDbg('BUF-STUCK', '0x33 包未能消费', { offset: i, len, raw: mt8CalibHex(buf, 24) });
                }
              } else if (isMt8CalibBuf && len > 0) {
                mt8CalibDbg('BUF-WAIT', '0x33 包不完整', { offset: i, len, bufLen: this.length });
              }
            }


            // 检查0x34包
            if (this[i] === 0x34) {
              //console.log('[校准] 收到0x34包');
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if (window._currentPage === 'calib' && typeof tryParseMidAdcPacketCalib === 'function') {
                  mt8CalibDbg('MID-0x34', '缓冲区发现 0x34 包', { offset: i, len });
                  parsed = tryParseMidAdcPacketCalib(buf);
                }
                if (parsed) {
                  if (isMt8CalibBuf) mt8CalibDbg('BUF-OUT', '消费 0x34 中心点包', { len, remain: this.length - (i + len + 2) });
                  this.splice(i, len+2);
                  found = true;
                  break;
                } else if (isMt8CalibBuf && window._currentPage === 'calib') {
                  mt8CalibDbg('BUF-STUCK', '0x34 包未能消费', { offset: i, len, raw: mt8CalibHex(buf, 16) });
                }
              } else if (isMt8CalibBuf && len > 0) {
                mt8CalibDbg('BUF-WAIT', '0x34 包不完整', { offset: i, len, bufLen: this.length });
              }
            }


            // 检查0x45包
            if (this[i] === 0x45) {
              //console.log('[校准] 收到0x45包');
              //console.log('this[i]:',this[i]);
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                //console.log('buf',buf);
                let parsed = false;
                //if (window._currentPage === 'net' && 
                if(typeof tryNetError === 'function') {
                  //console.log('[识别到没有ELRS固件] tryNetError Running');
                  parsed = tryNetError(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }

            if(this[i] === 0xAB) {
              const len = this[i+1];
              if (this.length >= i + len+ 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if (typeof tryParseFlightModePacket === 'function') {
                  parsed = tryParseFlightModePacket(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }

            if(this[i] === 0x9A) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if(typeof tryParseDRChannelPacket === 'function') {
                  parsed = tryParseDRChannelPacket(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }


            if(this[i] === 0x89) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if(typeof tryParseDRPacket === 'function') {
                  parsed = tryParseDRPacket(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }

            // 在Array.prototype.push代理中添加：
            if (this[i] === 0x55) {
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
                if (typeof tryParseTrimPacket === 'function') {
                  parsed = tryParseTrimPacket(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  break;
                }
              }
            }


            if (this[i] === 0xFF) {
              const len = this[i+1];
              if (this.length >= i + len + 2) {
                const buf = this.slice(i, i+len+2);
                let parsed = false;
              } 
              if (this.length >= i + len + 2 && len >0) {        
                // 只处理一次完整包
                const buf = new Uint8Array(this.slice(i, i+len+2));
                const devInfo = parseDeviceInfoPacket(buf);
                if (devInfo) {
                  console.log('[设备属性] 收到原始包:'+this.slice(i, i+len+2).map(x=>x.toString(16).padStart(2,'0')).join(' '));
                  window._deviceInfo = devInfo;
                  renderDeviceInfoPage();
                  if (window._waitingDevAttr) clearTimeout(window._waitingDevAttr);
                  console.log('[设备属性] 解析并渲染完成');
                  this.splice(i, len+2);
                } else {
                  //console.warn('[设备属性] 解析失败');
                }
              }
            } 
            // 检查0x67包  link强度
            if (this[i] === 0x67) {
              //console.log('[校准] 收到0x45包');
              //console.log('this[i]:',this[i]);
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                //console.log('buf',buf);
                let parsed = false;
                //if (window._currentPage === 'net' && 
                if(typeof linkStats === 'function') {
                  //console.log('[识别到没有ELRS固件] tryNetError Running');
                  parsed = linkStats(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  console.log("信号强度:",g_linkState);
                  break;
                }
              }
            }
          }
          else 
          {

            // 检查0x67包  link强度
            if (this[i] === 0x67) {
              //console.log('[校准] 收到0x45包');
              //console.log('this[i]:',this[i]);
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                const buf = this.slice(i, i+len+2);
                //console.log('buf',buf);

                //if (window._currentPage === 'net' &&

                  //console.log('[识别到没有ELRS固件] tryNetError Running');
                  parsed = linkStats(buf);
                }
                if (parsed) {
                  this.splice(i, len+2);
                  found = true;
                  console.log("信号强度:",g_linkState);
                  break;
                }
              }
            }

            // 进度条
            if(this[i] === 0x23){
              const len = this[i+1];
              if (this.length >= i + len + 2 && len >0) {
                let parsed = false;
                const buf = this.slice(i, i+len+2);
                if (window._currentPage === 'net' && typeof tryParseNetProgress === 'function')
                {
                  parsed = tryParseNetProgress(buf);
                  if (parsed) {
                    this.splice(i, len+2);

                    if(buf[3]==2)
                    {
                      
                      rxLuaStats = buf[2];
                      document.getElementById('settings-status-rx').textContent =rxLuaStats;

                      //console.log('数据异常:'+buf);
                    }
                    else
                    {
                      console.log('未知异常:'+buf);
                    }
                    //console.log('进程:%d 所属:%d',buf[2],buf[3]);
                    break;
                  }
                }
              }
            }
          }

        }
        
      } while(found);
      if (isMt8CalibBuf && window._mt8CalibDebug) {
        const bufLenAfter = this.length;
        if (parseLoop > 50) {
          mt8CalibDbg('BUF-WARN', `解析循环 ${parseLoop} 轮(可能卡顿)`, {
            before: bufLenBeforeParse,

            state: window.carCalibState
          });
        }
      }
      return ret;
    };

        channelRequest: () => {
          if (!state.gotMap || !writer) return;

    /** 传感器：devName 含 Sensor（如 Cell Sensor、Baro Sensor） */
    function isSensorDevice(devOrName) {
      const name = (typeof devOrName === 'string' ? devOrName : (devOrName && devOrName.devName) || '').trim();
      return name.length > 0 && /\bSensor\b/i.test(name);
    }

    function getDeviceUIMode() {
      const dev = window._deviceInfo;
      if (!dev) return 'unknown';
      if (isSensorDevice(dev)) return 'sensor';
      if (isMT8DeviceName(dev.devName)) return 'mt8';
      if (isMT6DeviceName(dev.devName)) return 'MT6';
      if (dev.devName === 'RadioMaster T8L') return 't8l';
      return 'remote';
    }

    window.isSensorDevice = isSensorDevice;

    function resetDeviceMainMenu() {
      ['dev-conf', 'dev-net', 'dev-cail'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    function applyDeviceUIMode() {
      const mode = getDeviceUIMode();
      const uart = document.getElementById('dev-uart');
      const attr = document.getElementById('dev-attr');
      const conf = document.getElementById('dev-conf');
      const net = document.getElementById('dev-net');
      const cail = document.getElementById('dev-cail');
      const updata = document.getElementById('dev-updata');
      const showRemoteMenus = mode === 'mt8' || mode === 'MT6' || mode === 't8l' || mode === 'remote';
      if (uart) uart.style.display = '';
      if (attr) attr.style.display = '';
      if (updata) updata.style.display = '';
      if (conf) conf.style.display = showRemoteMenus ? '' : 'none';
      if (net) net.style.display = showRemoteMenus ? '' : 'none';
      if (cail) cail.style.display = showRemoteMenus ? '' : 'none';
      if (mode === 'sensor') {
        const fwType = document.getElementById('fw-device-type');
        if (fwType) {
          fwType.value = 'sensor';
          upDataDev = 'sensor';
        }
      }
    }

    function formatSerialNumberDisplay(serialNumber) {
      if (!serialNumber) return '';
      const arr = typeof serialNumber === 'string'
        ? Array.from(serialNumber).map((c) => c.charCodeAt(0))
        : Array.from(serialNumber);
      return arr.map((b) => b.toString(16).padStart(2, '0')).join('').replace(/(00)+$/, '');
    }

    function bindExitFwUpdateBtn() {
      const exitFwUpdateBtn = document.getElementById('exit-fw-update-btn');
      if (!exitFwUpdateBtn) return;
      exitFwUpdateBtn.onclick = function () {
        if (typeof writer === 'undefined' || !writer) return;

        const cmd = new Uint8Array([0x34]);
        const sendExitCmd = async () => {
          if (typeof writer === 'undefined' || !writer) {
            stopExitFwUpdateContinuousSend('writer lost');
            return;
          }
          try {
            await writer.write(cmd);
          } catch (e) {
            stopExitFwUpdateContinuousSend((e && e.message) || 'write failed');
            await handleSerialDisconnect((e && e.message) || 'exit fw update serial lost');
          }
        };

        upDataFlag = 0;
        localStorage.removeItem('upDataFlag');
        console.log('[FW] 退出固件更新，已清除localStorage中的upDataFlag');

        if (isContinuousExitFwUpdateDevice()) {
          if (_exitFwUpdateSending) return;
          _exitFwUpdateSending = true;
          exitFwUpdateBtn.disabled = true;
          console.log('[ATTR] T8L/MT8/MT6 bootloader：开始连续发送退出固件更新指令，直到串口丢失');
          sendExitCmd();
          _exitFwUpdateSendTimer = setInterval(sendExitCmd, 100);
        } else {
          sendExitCmd();
          console.log('[ATTR] 已发送退出固件更新指令');
        }
      };
    }
