<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RadioMaster Devices Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    
    body {
      margin: 0;
      font-family: 'Roboto', monospace;
      background: linear-gradient(135deg, #e0e7ff 0%, #f4f6fb 100%);
      color: #222;
      min-height: 100vh;
    }

        /* 信号容器样式 */
    .signal-container {
      position: relative;
      width: 50px;
      height: 45px;
      display: flex;
      align-items: flex-end;
      gap: 5px; /* 信号格之间的间距 */
      padding-bottom: 5px;
    }

    /* 信号格基础样式 */
    .signal-bar {
      width: 8px; /* 所有信号格宽度一致 */
      background-color: #e0e0e0; /* 默认灰色 */
      border-radius: 1px; /* 轻微圆角 */
      transition: background-color 0.25s ease; /* 平滑过渡 */
    }

    /* 每个信号格的高度（左到右递增，梯子样式） */
    .bar-1 { height: 10px; } /* 最左，最弱 */
    .bar-2 { height: 20px; }
    .bar-3 { height: 30px; }
    .bar-4 { height: 40px; } /* 最右，最强 */

    /* 红叉样式（两个交叉的线条） */
    .cross {
      position: absolute;
      background-color: #ff4444;
      width: 2px;
      height: 12px;
      border-radius: 1px;
      transition: opacity 0.25s ease;
      opacity: 0; /* 默认隐藏 */
    }

    /* 红叉位置：在第二个和第三个信号格之间 */
    .cross-1 {
      top: 18px;
      left: 22px;
      transform: rotate(45deg);
    }

    .cross-2 {
      top: 18px;
      left: 22px;
      transform: rotate(-45deg);
    }

    /* 状态1：未连接（全灰 + 显示红叉） */
    .state-disconnected .cross {
      opacity: 1; /* 显示红叉 */
    }

    .state-disconnected .signal-bar {
      background-color: #e0e0e0; /* 全灰 */
    }

    /* 状态2：1格信号（仅最左1格绿） */
    .state-signal-1 .bar-1 {
      background-color: #4CAF50; /* 绿色 */
    }

    .state-signal-1 .bar-2,
    .state-signal-1 .bar-3,
    .state-signal-1 .bar-4 {
      background-color: #e0e0e0; /* 灰色 */
    }

    /* 状态3：2格信号（左2格绿） */
    .state-signal-2 .bar-1,
    .state-signal-2 .bar-2 {
      background-color: #4CAF50;
    }

    .state-signal-2 .bar-3,
    .state-signal-2 .bar-4 {
      background-color: #e0e0e0;
    }

    /* 状态4：3格信号（左3格绿） */
    .state-signal-3 .bar-1,
    .state-signal-3 .bar-2,
    .state-signal-3 .bar-3 {
      background-color: #4CAF50;
    }

    .state-signal-3 .bar-4 {
      background-color: #e0e0e0;
    }

    /* 状态5：4格信号（全绿） */
    .state-signal-4 .signal-bar {
      background-color: #4CAF50;
    }

    /* 新电池图标样式 */
    .battery-outer {
      position: relative;
      width: 32px;
      height: 18px;
      border: 2.5px solid #fff;
      border-radius: 7px;
      background: #23272f;
      box-shadow: 0 1px 4px rgba(79,140,255,0.10);

      margin-right: 2px;

    .battery-head {

      height: 8px;
      background: #fff;
      border-radius: 2px;

    /* 菜单栏美化 */
    .menu-btn {
      background: none;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 1em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      letter-spacing: 1px;
    }
    .menu-btn::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 24px;
      right: 24px;
      height: 2px;
      background: #fff;
      transform: scaleX(0);
      transition: transform 0.3s;
    }
    .menu-btn:hover::after,
    .menu-btn.active::after {
      transform: scaleX(1);
    }

      color: #fff;
    }

      color: #fff;

    /* 设备校准页面全白背景 */
    #page-calib {
      background: #fff !important;
      min-height: calc(100vh - 64px);
      width: 100vw;
      position: relative;
      z-index: 1;
    }
    .progress-bar {
      position: relative;
      height: 26px; /* 与圆点高度一致 */
      box-sizing: border-box;
      background: none;
    }
    .progress-bar .bar-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: #b3cfff;
      border-radius: 2px;
      transform: translateY(-50%);
      z-index: 1;
    }
    .progress-dot {
      position: absolute;
      top: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      box-shadow: 0 2px 12px #b3cfff;
      border: 3px solid #fff;
      transition: left 0.3s;
      z-index: 2;
      background: #2ecc71; /* 或 #4f8cff */
    }
    .keymode-select {
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(90deg, #eaf1ff 0%, #c3dafe 100%);
      border: 1.5px solid #3358e0;
      border-radius: 8px;
      padding: 8px 28px 8px 12px;
      font-size: 1.08em;
      font-family: 'Roboto', monospace;
      color: #3358e0;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(51,88,224,0.08);
      transition: border 0.2s, box-shadow 0.2s;
      cursor: pointer;
      outline: none;
      margin-bottom: 2px;

 /* 关闭按钮 - 纯CSS绘制叉叉 */
 .progress-modal__close {

  <script>

    // web版本打印
    //console.log('RadioMasterWeb_V1.6.2');
    
    // 添加初始化完成标记
    window._appInitialized = false;
    
    // 添加全局错误处理
    window.addEventListener('error', function(event) {
      console.error('Global error:', event.error);
    });
    
    window.addEventListener('unhandledrejection', function(event) {
      const r = event.reason;
      const isDeviceLost = r && (
        r.name === 'NetworkError' ||
        (r.message && String(r.message).includes('device has been lost'))
      );
      if (isDeviceLost) {
        event.preventDefault();
        if (typeof handleSerialDisconnect === 'function') {
          handleSerialDisconnect(r.message || 'device lost');
        }
        return;
      }
      console.error('Unhandled promise rejection:', event.reason);
    });
    
    // 检测操作系统类型
    function detectOS() {
      const userAgent = navigator.userAgent || navigator.appVersion || navigator.vendor || '';
      const platform = navigator.platform || '';
      
      // 检测Windows
      if (userAgent.indexOf('Win') !== -1 || platform.indexOf('Win') !== -1) {
        return 'Windows';
      }
      
      // 检测Mac
      if (userAgent.indexOf('Mac') !== -1 || platform.indexOf('Mac') !== -1) {
        return 'Mac';
      }
      
      // 检测Linux
      if (userAgent.indexOf('Linux') !== -1 || platform.indexOf('Linux') !== -1) {
        return 'Linux';
      }
      
      // 检测iOS
      if (userAgent.indexOf('iPhone') !== -1 || userAgent.indexOf('iPad') !== -1) {
        return 'iOS';
      }
      
      // 检测Android
      if (userAgent.indexOf('Android') !== -1) {
        return 'Android';
      }
      
      return 'Unknown';
    }
    
    // 获取当前操作系统（全局变量）
    const currentOS = detectOS();
    console.log('检测到的操作系统:', currentOS);
    
    // 检查串口API可用性
    function checkSerialAPISupport() {
      if (!navigator.serial) {
        console.warn('Serial API not supported in this browser/environment');
        return false;
      }
      return true;
    }
    
    // 初始化时检查串口API
    if (!checkSerialAPISupport()) {
      console.log('Serial API检查失败，将在连接时提供更好的错误信息');
    }
    
    // 检测权限策略违规
    let permissionsPolicyViolation = false;
    
    // 监听权限策略违规
    const originalConsoleError = console.error;
    console.error = function(...args) {
      const message = args.join(' ');
      if (message.includes('Permissions policy violation') && message.includes('serial')) {
        permissionsPolicyViolation = true;
        console.warn('⚠️ 检测到串口权限策略违规，应用将在受限模式下运行');
        // 更新状态显示
        setTimeout(() => {
          const statusBox = document.getElementById('serial-status');
          if (statusBox) {
            statusBox.textContent = '检测到权限限制，建议在新窗口中打开应用';
            statusBox.style.color = '#ff6b6b';
          }
        }, 1000);
      }
      originalConsoleError.apply(console, args);
    };

    // ========== 全局任务管理器 ==========
    window._pageTasks = {
      timers: [],
      intervals: [],
      listeners: [],
      custom: [],
    };
    function stopAllTasks() {
      window._pageTasks.timers.forEach(id => clearTimeout(id));
      window._pageTasks.timers = [];
      window._pageTasks.intervals.forEach(id => clearInterval(id));
      window._pageTasks.intervals = [];
      window._pageTasks.listeners.forEach(({target, type, fn}) => {
        target.removeEventListener(type, fn);
      });
      window._pageTasks.listeners = [];
      window._pageTasks.custom.forEach(fn => { try { fn(); } catch(e) {} });
      window._pageTasks.custom = [];
    }
    // 新结构页面元素
    document.getElementById('recv-hex').checked = true;
    const connectPage = document.getElementById('connect-page');
    const mainApp = document.getElementById('main-app');
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const sendBtn = document.getElementById('send');
    const inputBox = document.getElementById('input');
    const outputBox = document.getElementById('output');
    const statusBox = document.getElementById('serial-status');
    const sendMode = document.getElementById('send-mode');
    const recvHex = document.getElementById('recv-hex');
    //const baudrateInput = document.getElementById('baudrate');
    //baudrateInput.value = 460800;//隐藏波特率输入框
    //baudrateInput.style.display = 'none';
    const clearOutputBtn = document.getElementById('clear-output');
    
    let port = null;
    let writer = null;
    let reader = null;
    let isSerialConnected = false;
    let netConfBuffer = [];
    let isReading = false;
    let _serialDisconnectHandled = false;
    let _exitFwUpdateSendTimer = null;
    let _exitFwUpdateSending = false;

    function stopExitFwUpdateContinuousSend(reason) {
      if (_exitFwUpdateSendTimer) {
        clearInterval(_exitFwUpdateSendTimer);
        _exitFwUpdateSendTimer = null;
        console.log('[FW] 已停止连续发送退出固件更新指令:', reason || 'unknown');
      }
      _exitFwUpdateSending = false;
      const exitFwUpdateBtn = document.getElementById('exit-fw-update-btn');
      if (exitFwUpdateBtn) exitFwUpdateBtn.disabled = false;
    }

    function isContinuousExitFwUpdateDevice() {
      const devName = (window._deviceInfo && window._deviceInfo.devName) || '';
      return devName === 'RadioMaster T8L' ||
        (typeof isMT8DeviceName === 'function' && isMT8DeviceName(devName)) ||
        (typeof isMT6DeviceName === 'function' && isMT6DeviceName(devName));
    }

    /** USB 拔出 / 设备丢失：停止所有定时写串口，释放 reader/writer，避免 NetworkError 反复弹出 */
    async function handleSerialDisconnect(reason) {
      if (_serialDisconnectHandled) return;
      _serialDisconnectHandled = true;

      const wasConnected = isSerialConnected || !!port;
      isSerialConnected = false;
      isReading = false;

      if (typeof stopGlobalChannelTimer === 'function') stopGlobalChannelTimer();
      if (typeof clearAllTimers === 'function') clearAllTimers();
      stopExitFwUpdateContinuousSend(reason || 'serial disconnect');
      if (_autoDevAttrTimer) { clearTimeout(_autoDevAttrTimer); _autoDevAttrTimer = null; }
      if (typeof _channelMapTimer !== 'undefined' && _channelMapTimer) {
        clearTimeout(_channelMapTimer);
        _channelMapTimer = null;
      }
      if (window.expoUpdateInterval) {
        clearInterval(window.expoUpdateInterval);
        window.expoUpdateInterval = null;
      }
      if (window.flightModeUpdateInterval) {
        clearInterval(window.flightModeUpdateInterval);
        window.flightModeUpdateInterval = null;
      }
      if (typeof window.stopFwReadyCheck === 'function') {
        window.stopFwReadyCheck('serial disconnect');
      }

      const r = reader;
      const w = writer;
      const p = port;
      reader = null;
      writer = null;
      port = null;

      try { if (r) { await r.cancel(); r.releaseLock(); } } catch (e) {}
      try { if (w) w.releaseLock(); } catch (e) {}
      try { if (p) await p.close(); } catch (e) {}

      if (typeof updateSignalStrength === 'function') updateSignalStrength(0);
      if (wasConnected) {
        console.warn('[串口] 连接已断开:', reason || 'unknown');
      }

      if (wasConnected) {
        if (isFwUpdateLikelyComplete()) {
          handleFwUpdateDeviceReboot(reason || 'disconnect');
        } else if (typeof upDataFlag === 'undefined' || upDataFlag !== 2) {
          if (typeof showConnectPage === 'function') showConnectPage();
          if (typeof hideDeviceInfoBar === 'function') hideDeviceInfoBar();
          if (typeof updateDeviceInfoBar === 'function') updateDeviceInfoBar();
          if (typeof updateAllLangText === 'function') updateAllLangText();
        }
      }

      setTimeout(() => { _serialDisconnectHandled = false; }, 300);
    }

    /**
     * ESP 烧录跳转开关 —— 只改这一个标志即可切换
     * false → ExpressLRS 官方 Web Flasher（新标签页）
     * true  → 本站 EspFlash.html（当前页跳转）
     */
    window.USE_LOCAL_ESP_FLASH = false;

    window.ESP_FLASH_OFFICIAL_URL = 'https://expresslrs.github.io/web-flasher/';
    window.ESP_FLASH_ENTRY = 'EspFlash.html';

    async function releaseSerialForEspFlash() {
      if (typeof writer !== 'undefined' && writer) {
        try {
          await writer.write(new Uint8Array([0xA5, 0x66, 0x02, 0x0D, 0x0A]));
          await new Promise(r => setTimeout(r, 400));
        } catch (e) {
          console.warn('[FW] 发送 ESP 更新模式指令失败:', e);
        }
      }
      await handleSerialDisconnect('navigate to ESP flash');
    }

    async function navigateToLocalEspFlashPage() {
      const lang = typeof getLang === 'function' ? getLang() : currentLang;
      const devName = (window._deviceInfo && window._deviceInfo.devName) || '';
      const qs = new URLSearchParams({ from: 'connection', lang });
      if (devName) qs.set('device', devName);
      await releaseSerialForEspFlash();
      window.location.href = window.ESP_FLASH_ENTRY + '?' + qs.toString();
    }

    async function navigateToEspFlashPage() {
      if (window.USE_LOCAL_ESP_FLASH) {
        await navigateToLocalEspFlashPage();
      } else {
        await releaseSerialForEspFlash();
        window.open(window.ESP_FLASH_OFFICIAL_URL, '_blank', 'noopener,noreferrer');
      }
    }

    function showTransmitterFirmwareDialog() {
      let dialog = document.createElement('div');
      dialog.style.position = 'fixed';
      dialog.style.left = '0';
      dialog.style.top = '0';
      dialog.style.width = '100vw';
      dialog.style.height = '100vh';
      dialog.style.background = 'rgba(0,0,0,0.18)';
      dialog.style.display = 'flex';
      dialog.style.alignItems = 'center';
      dialog.style.justifyContent = 'center';
      dialog.style.zIndex = '9999';

      let inner = document.createElement('div');
      inner.style.background = '#fff';
      inner.style.borderRadius = '18px';
      inner.style.boxShadow = '0 4px 24px rgba(79,140,255,0.18)';
      inner.style.padding = '38px 48px 32px 48px';
      inner.style.display = 'flex';
      inner.style.flexDirection = 'column';
      inner.style.alignItems = 'center';
      inner.style.minWidth = '320px';
      inner.style.maxWidth = '90vw';

      inner.innerHTML = `
        <div style="font-size:1.18em;color:#3358e0;font-weight:bold;margin-bottom:18px;">${LANGS[currentLang]['select-firmware-update-method']}</div>
        <div style="font-size:1.08em;color:#222;margin-bottom:24px;text-align:center;">${LANGS[currentLang]['select-firmware-update-method-desc']}</div>
      `;

      let btnWeb = document.createElement('button');
      btnWeb.textContent = LANGS[currentLang]['jump-to-elrs-website'];
      btnWeb.style.background = 'linear-gradient(90deg,#4f8cff 0%,#3358e0 100%)';
      btnWeb.style.color = '#fff';
      btnWeb.style.border = 'none';
      btnWeb.style.borderRadius = '8px';
      btnWeb.style.padding = '12px 32px';
      btnWeb.style.fontSize = '1.08em';
      btnWeb.style.fontWeight = 'bold';
      btnWeb.style.cursor = 'pointer';
      btnWeb.style.marginBottom = '16px';
      btnWeb.onclick = async () => {
        document.body.removeChild(dialog);
        await navigateToEspFlashPage();
      };

      let btnCancel = document.createElement('button');
      btnCancel.textContent = LANGS[currentLang]['cancel'];
      btnCancel.style.background = '#e0e7ff';
      btnCancel.style.color = '#3358e0';
      btnCancel.style.border = 'none';
      btnCancel.style.borderRadius = '8px';
      btnCancel.style.padding = '10px 32px';
      btnCancel.style.fontSize = '1.08em';
      btnCancel.style.fontWeight = 'bold';
      btnCancel.style.cursor = 'pointer';
      btnCancel.onclick = () => {
        document.body.removeChild(dialog);
      };

      inner.appendChild(btnWeb);
      inner.appendChild(btnCancel);
      dialog.appendChild(inner);
      document.body.appendChild(dialog);
    }

    async function safeSerialWrite(data) {
      if (!isSerialConnected || !writer) return false;
      try {
        const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
        await writer.write(bytes);
        return true;
      } catch (e) {
        const lost = e && (e.name === 'NetworkError' || (e.message && String(e.message).includes('device has been lost')));
        if (lost) await handleSerialDisconnect(e.message);
        return false;
      }
    }

    let ymodem =[];
    let recvMidAdc = [];
    // 从localStorage恢复upDataFlag状态，以便页面刷新后能继续固件更新流程
    let upDataFlag = parseInt(localStorage.getItem('upDataFlag')) || 0;
    if (upDataFlag !== 0) {
      console.log('[FW] 从localStorage恢复upDataFlag:', upDataFlag);
    }
    /** 固件 YMODEM 传输进度（用于设备校验后重启、未收到结束帧时判断） */
    window._fwYmodemBytesSent = 0;
    window._fwYmodemBytesTotal = 0;
    window._fwYmodemProgress = 0;
    window._fwUpdateRebootExpected = false;

    function isFwUpdateLikelyComplete() {
      if (window._currentPage !== 'fw') return false;
      const total = window._fwYmodemBytesTotal || 0;
      const sent = window._fwYmodemBytesSent || 0;
      if (total > 0 && sent >= total) return true;
      if ((window._fwYmodemProgress || 0) >= 99) return true;
      return false;
    }

    function handleFwUpdateDeviceReboot(reason) {
      window._fwUpdateRebootExpected = true;
      upDataFlag = 0;
      localStorage.removeItem('upDataFlag');
      console.log('[FW] 已清除localStorage中的upDataFlag');
      window._isYmodemBusy = false;
      window._fwYmodemBytesSent = 0;
      window._fwYmodemBytesTotal = 0;
      window._fwYmodemProgress = 0;
      if (typeof window.stopFwReadyCheck === 'function') {
        window.stopFwReadyCheck('device reboot after fw update');
      }
      if (typeof updateFwUI === 'function') updateFwUI();
      if (typeof showConnectPage === 'function') showConnectPage();
      if (typeof hideDeviceInfoBar === 'function') hideDeviceInfoBar();
      if (typeof updateDeviceInfoBar === 'function') updateDeviceInfoBar();
      if (statusBox) {
        statusBox.textContent = (LANGS[currentLang] && LANGS[currentLang]['update-over']) || '更新完毕，设备已重启，请重新连接';
        statusBox.style.color = '#27ae60';
      }
      if (typeof updateAllLangText === 'function') updateAllLangText();
      console.log('[FW] 更新后设备重启断开，已返回串口连接页:', reason);
    }

    let upDataDev = "remote";
    let channelMap = {};
    let changeChannelData = [];
    // 根据操作系统设置初始波特率：Mac使用460800，Windows使用420000
    let currentBaudRate = (currentOS === 'Windows') ? 420000 : 460800; // 当前使用的波特率
    let baudRateDetectionActive = false; // 波特率检测是否激活
    let rxLuaStats = 0;
    let txLuaStats = 0;
    let progressTimer = null; // 超时定时器
    let progressInterval = null; // 进度监听（模拟，实际需替换为真实数据更新）
    let isProcessing = false; // 操作锁

    //let currentLang = localStorage.getItem('lang') || 'zh';//|| 'auto';
    let currentLang = 'en';
    
    let g_linkState = {
      upLinkRssiAnt1: 0,           // uint8_t -> 无符号8位整数
      upLinkRssiAnt2: 0,           // uint8_t
      upLinkPackageSuccessRate: 0, // uint8_t
      upLinkSNR: 0,                // int8_t -> 有符号8位整数
      diversityActiveAntenna: 0,   // uint8_t
      rfMode: 0,                   // uint8_t (原RF_Mode，JavaScript建议用驼峰命名)
      upLinkTxPower: 0,            // uint8_t (原upLinkTxPwoer，可能是拼写错误)
      downLinkRssi: 0,             // uint8_t
      downLinkPackSuccessRate: 0,  // uint8_t
      downLinkSNR: 0,              // int8_t
      connectFlag: ''              // char -> 字符
  };

    // 页面切换逻辑

    // 通道映射
    // 波特率切换函数
    async function switchBaudRate(newBaudRate) {
      if (!port || !isSerialConnected) {
        console.error('[BaudRate] 无法切换波特率：串口未连接');
        return false;
      }
      
      try {
        console.log(`[BaudRate] 正在切换波特率: ${currentBaudRate} -> ${newBaudRate}`);
        
        // 停止读取循环
        isSerialConnected = false;
        
        // 释放reader
        if (reader) {
          try {
            await reader.cancel();
            reader.releaseLock();
          } catch (e) {
            console.warn('[BaudRate] 释放reader时出错:', e);
          }
          reader = null;
        }
        
        // 释放writer
        if (writer) {
          try {
            writer.releaseLock();
          } catch (e) {
            console.warn('[BaudRate] 释放writer时出错:', e);
          }
          writer = null;
        }
        
        // 关闭串口
        try {
          await port.close();
        } catch (e) {
          console.warn('[BaudRate] 关闭串口时出错:', e);
        }
        
        // 重新打开串口（新波特率）
        await port.open({ baudRate: newBaudRate });
        
        // 重新获取writer和reader
        writer = port.writable.getWriter();
        reader = port.readable.getReader();
        
        // 更新当前波特率
        currentBaudRate = newBaudRate;
        isSerialConnected = true;
        
        // 重新启动读取循环
        readLoop();
        
        console.log(`[BaudRate] 波特率切换成功: ${newBaudRate}`);
        return true;
      } catch (error) {
        console.error(`[BaudRate] 切换波特率失败 (${newBaudRate}):`, error);
        isSerialConnected = false;
        return false;
      }
    }

    // 发送数据（发送后不清空输入框）
    sendBtn.onclick = async () => {
      const data = inputBox.value.trim(); 
      if (!writer || !data) return;
      if (sendMode.value === 'hex') {
        // 16进制发送
        try {
          let bytes = [];
          // 判断有无空格
          const hasSpace = /\s/.test(data);
          const noSpace = !hasSpace;
          // 检查是否混合（如01 2233）
          if (hasSpace && /[^0-9a-fA-F\/s]/.test(data)) throw new Error('仅允许0-9A-F字符和空格');
          if (hasSpace && /[0-9a-fA-F]{3,}/.test(data.replace(/\s+/g, ' '))) throw new Error('空格分隔时每组最多2位');
          if (hasSpace && /[0-9a-fA-F]{1,2}(\s+[0-9a-fA-F]{1,2})*/.test(data.replace(/ +/g, ' ')) && /[0-9a-fA-F]{3,}/.test(data.replace(/\s+/g, ' '))) throw new Error('空格分隔时每组最多2位');
          if (hasSpace) {
            // 空格分隔
            const parts = data.split(/\s+/).filter(Boolean);
            for (let part of parts) {
              if (!/^[0-9a-fA-F]{1,2}$/.test(part)) throw new Error('空格分隔时每组必须为1~2位16进制');
              if (part.length === 1) part = '0' + part;
              bytes.push(parseInt(part, 16));
            }
          } else {
            // 连续字符串
            if (!/^[0-9a-fA-F]+$/.test(data)) throw new Error('仅允许0-9A-F字符');
            if (data.length % 2 !== 0) throw new Error('连续输入时必须为偶数位');
            for (let i = 0; i < data.length; i += 2) {
              bytes.push(parseInt(data.substr(i, 2), 16));
            }
          }
          await writer.write(new Uint8Array(bytes));
        } catch (e) {
          alert('16进制输入有误: ' + e.message);
        }
      } else {

    const _mt8CalibDbgThrottle = {};
    function mt8CalibHex(arr, maxLen) {
      const limit = maxLen || 48;
      const list = Array.isArray(arr) ? arr : Array.from(arr || []);
      const head = list.slice(0, limit).map(x => x.toString(16).padStart(2, '0')).join(' ');
      return list.length > limit ? head + ` …(+${list.length - limit}B)` : head;
    }
    function mt8CalibDbg(tag, msg, extra) {
      if (!window._mt8CalibDebug) return;
      const onCalib = window._currentPage === 'calib';
      const isMt8 = window._deviceInfo && (window._deviceInfo.devName === 'RadioMaster MT8' || window._deviceInfo.devName === 'RadioMaster MT6');
      if (!onCalib && !isMt8) return;
      const hotTags = ['ADC-0x33', 'BUF-OUT', 'BUF-PARSE', 'RECV', 'CH-0x22'];
      if (hotTags.includes(tag)) {
        const now = Date.now();
        const last = _mt8CalibDbgThrottle[tag] || 0;
        if (now - last < 800) return;
        _mt8CalibDbgThrottle[tag] = now;
      }
      const ts = new Date().toISOString().slice(11, 23);
      if (extra !== undefined) {
        console.log(`[MT8-CALIB][${ts}][${tag}] ${msg}`, extra);
      } else {
        console.log(`[MT8-CALIB][${ts}][${tag}] ${msg}`);
      }
    }
    function mt8CalibLogCrcFail(pktName, buf, len, crc, calcCrc) {
      mt8CalibDbg('CRC-FAIL', `${pktName} CRC 不匹配 len=${len}`, {
        expect: '0x' + crc.toString(16),
        calc: '0x' + calcCrc.toString(16),
        raw: mt8CalibHex(buf)
      });

    /** MT8 校准页：合并解析 0x33（只保留最新一帧），0x34 立即处理，跳过全量扫描 */
    function processMt8CalibSerialBuffer(buf) {
      if (!buf || buf.length === 0) return;
      if (buf.length > 384) {
        mt8CalibDbg('BUF-TRIM', '校准缓冲过大，截断旧数据', { len: buf.length });
        buf.splice(0, buf.length - 128);
      }
      let safety = 0;
      while (safety++ < 6 && buf.length > 0) {
        if (buf[0] === 0x34) {
          const len = buf[1];
          const total = len + 2;
          if (len >= 1 && len <= 32 && buf.length >= total) {
            const packet = buf.slice(0, total);
            if (typeof tryParseMidAdcPacketCalib === 'function' && tryParseMidAdcPacketCalib(packet)) {
              buf.splice(0, total);
              continue;
            }
            buf.shift();
            continue;
          }
          if (len >= 1 && len <= 32) return;
          buf.shift();
          continue;
        }
        if (buf[0] === 0x33) {
          let idx = 0;
          let lastPacket = null;
          let consumeEnd = 0;
          while (idx < buf.length && buf[idx] === 0x33) {
            const len = buf[idx + 1];
            const total = len + 2;
            if (len < 1 || len > 128) { idx++; continue; }
            if (idx + total > buf.length) break;
            lastPacket = buf.slice(idx, idx + total);
            consumeEnd = idx + total;
            idx += total;
          }
          if (lastPacket) {
            if (typeof window.tryParseCarAdcPacket === 'function') {
              window.tryParseCarAdcPacket(lastPacket);
            }
            buf.splice(0, consumeEnd);
            continue;
          }
          return;
        }
        mt8CalibDbg('BUF-SKIP', '跳过非校准包头', { byte: '0x' + buf[0].toString(16), len: buf.length });
        buf.shift();
      }
    }

        p = unitEnd + 1;
      } else if ([2,3].includes(baseType)) { // UINT16/INT16
        value = paramData[p] | (paramData[p+1] << 8); p += 2;
        min = paramData[p] | (paramData[p+1] << 8); p += 2;
        max = paramData[p] | (paramData[p+1] << 8); p += 2;
        def = paramData[p] | (paramData[p+1] << 8); p += 2;
        let unitEnd = p; 
        while (paramData[unitEnd] !== 0) 
        {
          unitEnd++;
          if(unitEnd>400)
          {
            console.error('unit长度异常');
            break;
          }
        }
        unit = new TextDecoder().decode(paramData.slice(p, unitEnd));
        //unit = unit.replace(/[^0-9a-zA-Z$$\-:;.\/ ]/g, '');
        p = unitEnd + 1;
      } else if (baseType === 8) { // FLOAT
        value = (paramData[p] | (paramData[p+1]<<8) | (paramData[p+2]<<16) | (paramData[p+3]<<24)); p += 4;
        min = (paramData[p] | (paramData[p+1]<<8) | (paramData[p+2]<<16) | (paramData[p+3]<<24)); p += 4;
        max = (paramData[p] | (paramData[p+1]<<8) | (paramData[p+2]<<16) | (paramData[p+3]<<24)); p += 4;
        def = (paramData[p] | (paramData[p+1]<<8) | (paramData[p+2]<<16) | (paramData[p+3]<<24)); p += 4;
        decimal = paramData[p++];
        step = (paramData[p] | (paramData[p+1]<<8) | (paramData[p+2]<<16) | (paramData[p+3]<<24)); p += 4;
        let unitEnd = p; 
        while (paramData[unitEnd] !== 0) 
        {
          unitEnd++;
          if(unitEnd>400)
          {
            console.error('unit长度异常');
            break;
          }
        }
        unit = new TextDecoder().decode(paramData.slice(p, unitEnd));
        //unit = unit.replace(/[^0-9a-zA-Z$$\-;:.\/ ]/g, '');
        p = unitEnd + 1;
      } else if (baseType === 9) { // TEXT_SELECTION
        let optsEnd = p; 
        while (paramData[optsEnd] !== 0) 
        {
          optsEnd++;
          if(optsEnd>400)
          {
            console.error('optsEnd长度异常');
            break;
          }
        }
        let optionsStr = new TextDecoder().decode(paramData.slice(p, optsEnd));
        //optionsStr = optionsStr.replace(/[^0-9a-zA-Z$$\-;:.\/ ]/g, '');
        options = optionsStr.split(';');
        p = optsEnd + 1;
        value = paramData[p++];
        min = paramData[p++];
        max = paramData[p++];
        def = paramData[p++];
        let unitEnd = p; 
        while (paramData[unitEnd] !== 0) 
        {
          unitEnd++;
          if(unitEnd>400)
          {
            console.error('unitEnd长度异常');
            break;
          }
        }
        unit = new TextDecoder().decode(paramData.slice(p, unitEnd));
        //unit = unit.replace(/[^0-9a-zA-Z$$\-;:.\/ ]/g, '');
        p = unitEnd + 1;
      } else if (baseType === 10) { // STRING
        strMaxLen = paramData[p++];
        let strEnd = p; 
        while (paramData[strEnd] !== 0) 
        {
          strEnd++;
          if(strEnd>400)
          {
            console.error('strEnd长度异常');
            break;
          }
        }
        value = new TextDecoder().decode(paramData.slice(p, strEnd));
        //value = value.replace(/[^0-9a-zA-Z$$\-;:.\/ ]/g, '');
        p = strEnd + 1;
        let defEnd = p; 
        while (paramData[defEnd] !== 0) 
        {
          defEnd++;
          if(defEnd>400)
          {
            console.error('def长度异常');
            break;
          }
        }
        def = new TextDecoder().decode(paramData.slice(p, defEnd));
        //def = def.replace(/[^0-9a-zA-Z$$\-;:.\/ ]/g, '');
        p = defEnd + 1;
      } else if (baseType === 11) { // FOLDER
        // nothing more
      } else if (baseType === 12) { // INFO
        let infoEnd = p; 
        while (paramData[infoEnd] !== 0) 
        {
          infoEnd++;
          if(infoEnd>400)
          {
            console.error('infoEnd长度异常');
            break;
          }
        }
        value = new TextDecoder().decode(paramData.slice(p, infoEnd));
        //value = value.replace(/[^0-9a-zA-Z$$\-:;\/ ]/g, ''); 
        p = infoEnd + 1;
      } else if (baseType === 13) { // COMMAND
        status = paramData[p++];
        timeout = paramData[p++];
        let infoEnd = p; 
        
        while (paramData[infoEnd] !== 0)      //现有一个乱码bug,因为名字结束的时候,没有\0导致的bug,所以会出现名字乱码,所以要选择删除
        {
          infoEnd++;
          if(infoEnd>400)
          {
            console.error('infoEnd长度异常');
            break;
          }
        }
        info = new TextDecoder().decode(paramData.slice(p, infoEnd));
        //info = info.replace(/[^0-9a-zA-Z$$\-:;\/ ]/g, '');
        p = infoEnd + 1;
      }
      return { parentFolder, dataType, baseType, hidden, name, value, min, max, def, unit, decimal, step, strMaxLen, options, status, timeout, info };
    }

    // 解析大包并渲染参数控件
    function parseCRSFPacket(bigPacket) {
      // let i = 0;
      // // 循环处理所有开头的多余数据块
      // while (i + 4 < bigPacket.length) { // 确保至少有5个元素（索引i到i+4）
      //   // 检查是否是0x23 0x03开头的多余数据块
      //   if (bigPacket[i] === 0x23 && bigPacket[i + 1] === 0x03) {
      //     i += 5; // 跳过这个5字节的数据块
      //   } else {
      //     break; // 不是目标数据块，停止处理
      //   }
      // }

      if(bigPacket[0]==0x56)
      {
        bigPacket = bigPacket.slice(1);
      }
      //console.log('处理后bigPacket:', bigPacket, '长度:', bigPacket.length);

      if (!bigPacket || bigPacket.length < 4) return '数据太短';
      let rxOrTx = '';
      // 跳过前2字节长度，去掉末尾3字节（CRC/0A/0D），判断包头
      if (bigPacket.length > 8) {
        // 例如: EE xx EE EC (RX) 或 EE xx EA EE (TX)
        const  b1 = bigPacket[5], b2 = bigPacket[6];
        // 打印前8字节内容
        //console.log('CRSF包头前8字节:', Array.from(bigPacket.slice(0, 8)));
        if (b1 === 0xEE && b2 === 0xEC) {
          rxOrTx = 'RX';
          console.log('识别到类型: RX');
        } else if (b1 === 0xEA && b2 === 0xEE) {
          rxOrTx = 'TX';
          console.log('识别到类型: TX');
        } else {
          console.log('未识别到RX/TX类型');
        }
      }
      // 更新LUA配置标题
      const pageNet = document.getElementById('page-net');
      if (pageNet) {
        const titles = pageNet.getElementsByClassName('comm-title');
        for (let i = 0; i < titles.length; i++) {
          if (titles[i].textContent.startsWith(LANGS['lua-config'])) {
            titles[i].textContent =LANGS[currentLang]['lua-config'] + (rxOrTx ? ` (${rxOrTx})` : '');
          }
        }
      }
      // ====== 原有参数解析逻辑 ======
      let offset = 2;
      const paramChunkCache = new Map(); // paramNum -> {chunks:[], chunkNums:Set}
      let index = 0;
      while (offset + 2 < bigPacket.length) {
        const head = bigPacket[offset];
        const len = bigPacket[offset+1];
        const type = bigPacket[offset+2];
        if (len === 0) {
          offset++;
          continue;
        }
        const packetTotalLen = 2 + len;
        if (offset + packetTotalLen > bigPacket.length) break;
        const pkt = bigPacket.slice(offset + 2, offset + 2 + len - 1 ); // pkt[0]=type
        if (type === 0x2B) {
          let po = 0;
          po++; // 跳过type
          const srcNode = pkt[po++];
          const dstNode = pkt[po++];
          const paramNum = pkt[po++];
          const chunkNum = pkt[po++];
          if (!paramChunkCache.has(paramNum)) paramChunkCache.set(paramNum, { chunks: [], chunkNums: new Set() });
          const entry = paramChunkCache.get(paramNum);
          if (entry.chunkNums.has(chunkNum)) {
            offset += packetTotalLen;
            continue;
          }
          entry.chunkNums.add(chunkNum);
          entry.chunks.push(pkt.slice(po)); // 从po开始，即payload部分，不含CRC
        } else if (type === 0x29) {
          // 处理ping包，提取名字（CRSF协议）
          let po = 0;
          po++; // 跳过type
          // CRSF ping包可能包含srcNode和dstNode，然后才是名字
          // 如果包长度足够，尝试跳过可能的头部信息
          if (pkt.length > 2) {
            // 尝试跳过srcNode和dstNode（如果存在）
            // 通常名字从第3个字节开始（跳过type, srcNode, dstNode）
            let nameStart = po;
            if (pkt.length > 3) {
              // 如果包足够长，可能包含srcNode和dstNode
              nameStart = po + 2; // 跳过可能的srcNode和dstNode
            }
            // 从nameStart开始提取名字（通常是字符串，可能以null结尾）
            const nameBytes = [];
            for (let i = nameStart; i < pkt.length; i++) {
              if (pkt[i] === 0) break; // 遇到null终止符
              if (pkt[i] < 32 || pkt[i] > 126) break; // 遇到非可打印字符，停止
              nameBytes.push(pkt[i]);
            }
            // 将字节转换为字符串
            if (nameBytes.length > 0) {
              const name = String.fromCharCode(...nameBytes).trim();
              if (name) {
                // 保存名字到全局变量
                window._crsfPingName = name;
                // 更新子菜单右上角显示
                updatePingNameDisplay(name);
                // console.log('[CRSF] 收到ping包(0x29)，名字:', name);
              }
            }
          }
        }
        offset += packetTotalLen;
      }
      // 组合结果：Map paramNum -> Uint8Array
      const paramDataMap = new Map();
      for (const [paramNum, entry] of paramChunkCache.entries()) {
        const fullData = new Uint8Array([].concat(...entry.chunks.map(a => Array.from(a))));
        paramDataMap.set(paramNum, fullData);
      }
      // 解析所有参数为结构化对象
      const paramList = [];
      for (const [paramNum, paramData] of paramDataMap.entries()) {
        const paramObj = parseParamData(paramData);
        paramObj.paramNum = paramNum;
        paramList.push(paramObj);
      }
      // 排序：只按paramNum（Parameter number）升序
      paramList.sort((a, b) => a.paramNum - b.paramNum);
      // 渲染参数控件
      const container = document.getElementById('wireless-settings');
      container.innerHTML = '';
      renderParameterControls(paramList, container);
      return paramList;
    }

        return (LANGS[currentLang] && LANGS[currentLang][key]) || (currentLang === 'en' ? en : zh);
      };
      const resetCarCalibData = () => {
        window.carAdcMax = Array(CAR_CALIB_CHANNELS.length).fill(0);
        window.carAdcMin = Array(CAR_CALIB_CHANNELS.length).fill(65535);
        window.carMidAdc = Array(CAR_CALIB_CHANNELS.length).fill(0);
        window.lastCarAdcData = Array(CAR_CALIB_CHANNELS.length).fill(0);
        window.carMidAdcReceived = false;
        window._carCalibRefRange = Array(CAR_CALIB_CHANNELS.length).fill(0);
      };
      const requestCarChannelData = () => {
        if (writer) writer.write(new Uint8Array([0xA5, 0x55, 0x02, 0x0D, 0x0A]));
      };
      const requestCarAdcData = () => {
        if (writer) writer.write(new Uint8Array([0xA5, 0x55, 0x04, 0x0D, 0x0A]));
      };
      const startCarPolling = requestFn => {
        window._globalChannelTask = {
          channelRequest: requestFn,
          commandRequest: () => {}
        };
        startGlobalChannelTimer(window.carCalibState === 'calibrating' ? 100 : 50);
      };
      const startCarChannelPolling = () => startCarPolling(requestCarChannelData);
      const startCarAdcPolling = () => startCarPolling(requestCarAdcData);
      // P1/P2 等通道低端 ADC 可为 0，0 是有效读数（贴左），不能判无效后显示 50%
      const isCarAdcValid = val => typeof val === 'number' && !isNaN(val) && val >= 0 && val < 4096;
      /** 参考全行程：优先用确认中心点时快照的上次校准，否则默认 1200 */
      const getCarCalibRefRange = (index) => {
        const saved = window._carCalibRefRange && window._carCalibRefRange[index];
        if (saved > 0) return saved;
        return CAR_CALIB_ADC_RANGE * 3;
      };
      /** 每侧最低扫幅 = max(250, 上次全行程 / 5) - 降低要求以适应单向操作的通道如油门 */
      const getCarCalibMinHalfSpan = (index) => {
        const refRange = getCarCalibRefRange(index);
        return Math.max(250, Math.ceil(refRange / 5));
      };
      const isCarChannelSweepValid = (index) => {
        const mid = window.carMidAdc[index];
        if (mid <= 0) return false;
        const minHalf = getCarCalibMinHalfSpan(index);
        return (window.carAdcMax[index] - mid) >= minHalf &&
          (mid - window.carAdcMin[index]) >= minHalf;
      };
      const updateCarCalibReadyState = () => {
        if (window.carCalibState !== 'calibrating') return;
        const validCount = CAR_CALIB_CHANNELS.reduce((count, _, index) => {
          const isValid = isCarChannelSweepValid(index);
          // 调试日志：显示每个通道的校准状态
          const mid = window.carMidAdc[index];
          const minHalf = getCarCalibMinHalfSpan(index);
          const maxSpan = window.carAdcMax[index] - mid;
          const minSpan = mid - window.carAdcMin[index];
          console.log(`[校准检查] 通道${index} (${CAR_CALIB_CHANNELS[index].id}): 中点=${mid}, 最大=${window.carAdcMax[index]}, 最小=${window.carAdcMin[index]}, 最大跨度=${maxSpan}, 最小跨度=${minSpan}, 需要>=${minHalf}, 有效=${isValid}`);
          return count + (isValid ? 1 : 0);
        }, 0);
        const allChannelsValid = window.carMidAdcReceived && validCount === CAR_CALIB_CHANNELS.length;
        console.log(`[校准检查] carMidAdcReceived=${window.carMidAdcReceived}, validCount=${validCount}/${CAR_CALIB_CHANNELS.length}, allChannelsValid=${allChannelsValid}`);
        calibBtn.disabled = !allChannelsValid;
        if (window.carMidAdcReceived && !allChannelsValid) {
          const channelText = isMT6 ? '两个通道' : '四个通道';
          const channelTextEn = isMT6 ? 'both channels' : 'all channels';
          stepLabel.textContent = getCarCalibText(
            'car-calib-step-label-done',
            `已获取中立点，请继续来回拨动${channelText} (${validCount}/${CAR_CALIB_CHANNELS.length})`,
            `Center points received. Keep moving ${channelTextEn} (${validCount}/${CAR_CALIB_CHANNELS.length})`
          );
        }
        if (allChannelsValid) {
          const channelText = isMT6 ? '两个通道' : '四个通道';
          const channelTextEn = isMT6 ? 'Both channels are' : 'All four channels are';
          stepLabel.textContent = getCarCalibText(
            'car-calib-ready-confirm',
            `${channelText}已完成扫描，请点击校准完成`,
            `${channelTextEn} scanned. Click Calibration Done`
          );
          refreshCarCalibDisplayFromLastAdc();
        }
      };
      window._carCalibReadyRaf = 0;
      const scheduleCarCalibReadyState = () => {
        if (window._carCalibReadyRaf) return;
        window._carCalibReadyRaf = requestAnimationFrame(() => {
          window._carCalibReadyRaf = 0;
          updateCarCalibReadyState();
        });
      };
      const sendCarCalibData = () => {
        const data = new Uint8Array(CAR_CALIB_CHANNELS.length * 6 + 2);
        for (let i = 0; i < CAR_CALIB_CHANNELS.length; i++) {
          data[i*6+0] = window.carAdcMax[i] & 0xFF;
          data[i*6+1] = (window.carAdcMax[i] >> 8) & 0xFF;
          data[i*6+2] = window.carAdcMin[i] & 0xFF;
          data[i*6+3] = (window.carAdcMin[i] >> 8) & 0xFF;
          data[i*6+4] = window.carMidAdc[i] & 0xFF;
          data[i*6+5] = (window.carMidAdc[i] >> 8) & 0xFF;
        }
        
        const buf = new Uint8Array(3 + data.length + 2);
        buf[0] = 0xA5;
        buf[1] = 0x55;
        buf[2] = 0x0A;
        buf.set(data, 3);
        buf[buf.length - 2] = 0x0D;
        buf[buf.length - 1] = 0x0A;
        
        if (writer) {
          writer.write(buf);
          console.log('[车控校准] 已发送校准数据:', Array.from(buf).map(x=>x.toString(16).padStart(2,'0')).join(' '));
        }
      };
      window.setCarMidAdcFromPacket = function(values, resetRange = true) {
        if (!Array.isArray(values) || values.length < CAR_CALIB_CHANNELS.length) {
          mt8CalibDbg('MID', 'setCarMidAdcFromPacket 数据无效', { values, state: window.carCalibState });
          return;
        }
        mt8CalibDbg('MID', '收到中心点数据', { values, resetRange, state: window.carCalibState });
        for (let i = 0; i < CAR_CALIB_CHANNELS.length; i++) {
          const midVal = values[i] || 0;
          window.carMidAdc[i] = midVal;
          if (resetRange) {
            const adcIdx = CAR_CALIB_CHANNELS[i].adcIndex;
            const prev = window._carDeviceCalibData && window._carDeviceCalibData[adcIdx];
            if (!window._carCalibRefRange) {
              window._carCalibRefRange = Array(CAR_CALIB_CHANNELS.length).fill(0);
            }
            if (prev && prev.max > prev.mid && prev.mid > prev.min) {
              window._carCalibRefRange[i] = prev.max - prev.min;
            } else {
              window._carCalibRefRange[i] = CAR_CALIB_ADC_RANGE * 3;
            }
            // 行程从中点开始重新采集，不能用上次 max/min 直接判通过
            window.carAdcMax[i] = midVal;
            window.carAdcMin[i] = midVal;
          }
        }
        window.carMidAdcReceived = window.carMidAdc.every(v => v > 0);
        mt8CalibDbg('MID', 'carMidAdcReceived=' + window.carMidAdcReceived, {
          mid: window.carMidAdc.slice(),
          refRange: window._carCalibRefRange.slice()
        });
        if (window.carCalibState === 'calibrating') {
          calibBtn.disabled = true;
          stepLabel.textContent = getCarCalibText(
            'car-calib-step-label-done',
            '已获取中立点，请拨动四个通道到最小和最大位置',
            'Center points received. Move all four channels to minimum and maximum'
          );
          scheduleCarCalibReadyState();
        }
      };
      const normalizeCarAdcPercent = (adc, calibData) => {
        if (!calibData) return 0;
        const max = calibData.max;
        const min = calibData.min;
        const mid = calibData.mid;
        if (!isCarAdcValid(adc) || !isCarAdcValid(max) || !isCarAdcValid(min) || !isCarAdcValid(mid) || max <= mid || mid <= min) {
          return normalizeCarAdcPercentCalibrating(adc, min, max);
        }
        const pct = adc >= mid
          ? 50 + (adc - mid) * 50 / (max - mid)
          : (adc - min) * 50 / (mid - min);
        return Math.max(0, Math.min(100, pct));
      };
      // 校准扫行程：按当前采集到的 min~max 线性映射；ADC=0 贴左，行程未拉开时也不默认 50%
      const normalizeCarAdcPercentCalibrating = (adc, min, max) => {
        if (!isCarAdcValid(adc)) return 0;
        const lo = Math.min(min, max);
        const hi = Math.max(min, max);
        const span = hi - lo;
        if (span < 30) return adc <= lo ? 0 : (adc >= hi ? 100 : 0);
        return Math.max(0, Math.min(100, (adc - lo) * 100 / span));
      };
      const getCarChannelCalibData = (index) => ({
        max: window.carAdcMax[index],
        min: window.carAdcMin[index],
        mid: window.carMidAdc[index]
      });
      const isCarChannelCalibReady = (index) => isCarChannelSweepValid(index);
      const carAdcToChannelValue = (adc, calib) => {
        const { max, min, mid } = calib;
        if (!isCarAdcValid(adc) || max <= mid || mid <= min) return INIT_VAL;
        let ch;
        if (adc >= mid) {
          ch = INIT_VAL + (adc - mid) * (MAX_VAL - INIT_VAL) / (max - mid);
        } else {
          ch = MIN_VAL + (adc - min) * (INIT_VAL - MIN_VAL) / (mid - min);
        }
        return Math.round(Math.max(MIN_VAL, Math.min(MAX_VAL, ch)));
      };
      const buildCarCalibDisplayValues = (carAdcValues) => {
        const pctValues = [];
        const displayValues = [];
        carAdcValues.forEach((adc, index) => {
          const calib = getCarChannelCalibData(index);
          pctValues[index] = normalizeCarAdcPercent(adc, calib);
          displayValues[index] = (window.carMidAdcReceived && isCarChannelCalibReady(index))
            ? carAdcToChannelValue(adc, calib)
            : adc;
        });
        return { displayValues, pctValues };
      };
      const carChannelValueToPercent = val => {
        if (!val || val < MIN_VAL) return 0;
        if (val > MAX_VAL) return 100;
        return (val - MIN_VAL) / (MAX_VAL - MIN_VAL) * 100;
      };
      const updateCarAdcDisplay = (values, pctValues) => {
        CAR_CALIB_CHANNELS.forEach((channel, index) => {
          const val = values[index] ?? 0;
          const pctNum = Array.isArray(pctValues)
            ? Math.max(0, Math.min(100, pctValues[index] ?? 0))
            : Math.max(0, Math.min(100, carChannelValueToPercent(val)));
          const pct = pctNum.toFixed(2);
          const fill = document.getElementById(`${channel.id}-fill`);
          const value = document.getElementById(`${channel.id}-value`);
          const percent = document.getElementById(`${channel.id}-percent`);
          
          if (fill) fill.style.width = pct + '%';
          if (value) value.textContent = val;
          if (percent) percent.textContent = pct + '%';
        });
      };
      window._carAdcDisplayPending = null;
      window._carAdcDisplayRaf = 0;
      const scheduleCarAdcDisplayUpdate = (values, pctValues) => {
        window._carAdcDisplayPending = { values, pctValues };
        if (window._carAdcDisplayRaf) return;
        window._carAdcDisplayRaf = requestAnimationFrame(() => {
          window._carAdcDisplayRaf = 0;
          const pending = window._carAdcDisplayPending;
          window._carAdcDisplayPending = null;
          if (pending) updateCarAdcDisplay(pending.values, pending.pctValues);
        });
      };
      const refreshCarCalibDisplayFromLastAdc = () => {
        const carAdcValues = window.lastCarAdcData;
        if (!Array.isArray(carAdcValues) || !carAdcValues.length) return;
        const { displayValues, pctValues } = buildCarCalibDisplayValues(carAdcValues);
        scheduleCarAdcDisplayUpdate(displayValues, pctValues);
      };
      const syncCarCalibLocalBeforeWrite = () => {
        window._carAppliedCalibSnapshot = CAR_CALIB_CHANNELS.map((_, i) => getCarChannelCalibData(i));
        refreshCarCalibDisplayFromLastAdc();
        mt8CalibDbg('SYNC', '写入前同步本地校准显示', window._carAppliedCalibSnapshot);
      };
      const collectCarAdcCalibration = values => {
        if (window.carCalibState !== 'calibrating') return;
        if (!values.every(isCarAdcValid)) return;
        
        if (!window.carMidAdcReceived) return;
        
        values.forEach((val, index) => {
          if (val > window.carAdcMax[index]) window.carAdcMax[index] = val;
          if (val < window.carAdcMin[index]) window.carAdcMin[index] = val;
        });
        scheduleCarCalibReadyState();
      };

      calibBtn.onclick = async function() {
        if (window.carCalibState === 'idle') {
          mt8CalibDbg('BTN', '点击: idle → calibratMid');
          resetCarCalibData();
          window.carCalibState = 'calibratMid';
          calibBtn.textContent = LANGS[currentLang]['confirm-center-point'] || '确认中心点';
          stepLabel.textContent = getCarCalibText(
            'car-calib-step-label-center-point',
            '请将油门 THR、方向 STE、P1、P2 置于中位，然后点击确认',
            'Place THR, STE, P1, and P2 at center, then confirm'
          );
          resetBtn.style.display = '';
          stopGlobalChannelTimer();
          requestCarAdcData();
        } else if (window.carCalibState === 'calibratMid') {
          mt8CalibDbg('BTN', '点击: 确认中心点 calibratMid → calibrating', {
            bufLen: serialBuffer.length,
            page: window._currentPage
          });
          if (window._currentPage === 'calib' && writer) {
            console.log('[车控校准流程] 发送一次获取中心点指令 0xA5,0x55,0x22,0x04,0x0D,0x0A');   //多发几次
            mt8CalibDbg('TX', '发送 0x22 0x04 请求中心点 (×3, 间隔 250ms)');
            writer.write(new Uint8Array([0xA5, 0x55, 0x22, 0x04, 0x0D, 0x0A]));
            setTimeout(() => {
              if (writer) writer.write(new Uint8Array([0xA5, 0x55, 0x22, 0x04, 0x0D, 0x0A]));
            }, 250);
            setTimeout(() => {
              if (writer) writer.write(new Uint8Array([0xA5, 0x55, 0x22, 0x04, 0x0D, 0x0A]));
            }, 500);
          }
          mt8CalibDbg('TX', '发送 0x04 请求 ADC');
          requestCarAdcData();
          window.carCalibState = 'calibrating';
          calibBtn.disabled = true;
          calibBtn.textContent = LANGS[currentLang]['calib-done'] || '校准完成';
          stepLabel.textContent = getCarCalibText(
            'car-calib-step-label-range',
            '正在等待中立点，请稍后拨动四个通道到最小和最大位置',
            'Waiting for center points, then move all four channels to minimum and maximum'
          );
          startCarAdcPolling();
          mt8CalibDbg('STATE', '已进入 calibrating, 启动 ADC 轮询', { bufLen: serialBuffer.length });
        } else if (window.carCalibState === 'calibrating') {
          if (calibBtn.disabled) return;
          const allReady = window.carMidAdcReceived &&
            CAR_CALIB_CHANNELS.every((_, i) => isCarChannelSweepValid(i));
          if (!allReady) {
            window.alert(getCarCalibText(
              'car-calib-not-ready',
              '请先获取中立点，并将四个通道各扫过足够行程后再完成校准',
              'Please capture center points and sweep all four channels through enough travel before finishing'
            ));
            scheduleCarCalibReadyState();
            return;
          }
          syncCarCalibLocalBeforeWrite();
          mt8CalibDbg('BTN', '点击: 校准完成, 发送 0x0A');
          sendCarCalibData();
          sendCarCalibData();
          sendCarCalibData();
          window.alert(LANGS[currentLang]['calib-over'] || '校准完成');
          calibBtn.disabled = false;
          calibBtn.textContent = LANGS[currentLang]['calib-start'] || '开始校准';
          stepLabel.textContent = LANGS[currentLang]['calib-start-step-label'] || '点击"开始校准"按键进行校准操作';
          resetBtn.style.display = 'none';
          window.carCalibState = 'idle';
          resetCarCalibData();
          startCarChannelPolling();
        }
      };

      resetBtn.onclick = async function() {
        calibBtn.textContent = LANGS[currentLang]['calib-start'] || '开始校准';
        calibBtn.disabled = false;
        stepLabel.textContent = LANGS[currentLang]['calib-start-step-label'] || '点击"开始校准"按键进行校准操作';
        resetBtn.style.display = 'none';
        window.carCalibState = 'idle';
        resetCarCalibData();
        startCarChannelPolling();
      };

      // 解析车控ADC数据
      window.tryParseCarAdcPacket = function(buf) {
        if (!buf || buf.length < 3) {
          mt8CalibDbg('ADC-0x33', '包过短', { len: buf ? buf.length : 0 });
          return false;
        }
        if (buf[0] !== 0x33) return false;
        const len = buf[1];
        if (buf.length < len + 2) {
          mt8CalibDbg('ADC-0x33', '数据不完整', { need: len + 2, got: buf.length });
          return false;
        }
        const crc = buf[len+1];
        const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
        if (crc !== calcCrc) {
          mt8CalibLogCrcFail('0x33-ADC', buf, len, crc, calcCrc);
          return false;
        }
        mt8CalibDbg('ADC-0x33', 'CRC OK', { len, state: window.carCalibState });
        
        let recvAdc = [];
        for (let i = 0; i < 4; i++) {
          let off = 2 + i*2;
          recvAdc[i] = buf[off] | (buf[off+1]<<8);
        }
        
        let recvAdcCailData = [];
        for (let i = 0; i < 4; i++) {
          let base = 21 + i*6;
          recvAdcCailData[i] = {
            max: buf[base] | (buf[base+1]<<8),
            min: buf[base+2] | (buf[base+3]<<8),
            mid: buf[base+4] | (buf[base+5]<<8)
          };
        }
        window._carDeviceCalibData = recvAdcCailData;
        
        const carAdcValues = CAR_CALIB_CHANNELS.map(channel => recvAdc[channel.adcIndex] || 0);
        window.lastCarAdcData = carAdcValues;
        collectCarAdcCalibration(carAdcValues);
        if (window.carCalibState === 'calibratMid' || window.carCalibState === 'calibrating') {
          if (window.carCalibState === 'calibrating' && !window.carMidAdcReceived) {
            return true;
          }
          const { displayValues, pctValues } = buildCarCalibDisplayValues(carAdcValues);
          scheduleCarAdcDisplayUpdate(displayValues, pctValues);
        }
        
        return true;
      };

      // 解析车控通道数据
      window.tryParseCarChannelPacket = function(buf) {
        if (!buf || buf.length < 3) {
          mt8CalibDbg('CH-0x22', '包过短', { len: buf ? buf.length : 0 });
          return false;
        }
        if (buf[0] !== 0x22) return false;
        const len = buf[1];
        if (buf.length < len + 2) {
          mt8CalibDbg('CH-0x22', '数据不完整', { need: len + 2, got: buf.length });
          return false;
        }
        const crc = buf[len+1];
        const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
        if (crc !== calcCrc) {
          mt8CalibLogCrcFail('0x22-CH', buf, len, crc, calcCrc);
          return false;
        }
        mt8CalibDbg('CH-0x22', 'CRC OK', { len, state: window.carCalibState });
        
        let recvChannel = [];
        for(let i = 0; i < 10; i++) {
          let off = 8 + i*2;
          let val = buf[off] | (buf[off+1]<<8);
          recvChannel[i] = val;
        }
        
        window.lastCarChannelData = recvChannel;
        
        const carCalibValues = CAR_CALIB_CHANNELS.map(channel => recvChannel[channel.recvIndex] || 0);
        window.lastCarCalibValues = carCalibValues;
        updateCarAdcDisplay(carCalibValues);
        
        return true;
      };

      // 请求通道数据
      if (writer) {
        writer.write(new Uint8Array([0xA5, 0x55, 0x02, 0x0D, 0x0A]));
      }
    }


    // --- 设备校准页面 ---

              // 更新微调值
              if (window.channelMap && window.channelMap.channelTrimSend) {
                window.channelMap.channelTrimSend[trimIdx] = value;

              // 更新微调UI
              updateTrimUI(trimIdx, value);
              
              // 更新滑块值显示
              const valSpan = document.getElementById(`val-${sliderId}`);
              if (valSpan) {
                valSpan.textContent = value;
              }
            });
          }
        });

      function updateTrimUI(trimIdx, value) {
        const trimValSpan = document.getElementById(`trim-val-${trimIdx}`);
        const trimDot = document.getElementById(`trim-dot-${trimIdx}`);
        const trimBar = document.getElementById(`trim-bar-${trimIdx}`);
        
        if (trimValSpan) trimValSpan.textContent = value;
        if (trimBar && trimDot) {
          let percent = (value + 130) / 260;
          let left = percent * (trimBar.offsetWidth - trimDot.offsetWidth);
          trimDot.style.left = left + 'px';
        }

      // 解析0x22包
      function tryParseOrigChannelPacketCalib(buf) {
        // 只在校准页面可见时刷新控件
        var pageCalib = document.getElementById('page-calib');
        if (!pageCalib || pageCalib.style.display === 'none') return;

        // 实时获取控件
        const btnGroup = document.getElementById('calib-btn-group');
        const slider = document.getElementById('calib-slider');
        const sliderValue = document.getElementById('calib-slider-value');
        const joy1Canvas = document.getElementById('joystick1');
        const joy2Canvas = document.getElementById('joystick2');
        const stateNames = ['low', 'mid', 'high'];
        const stateSvgs = [
          // 低：倒三角
          '<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,22 4,8 24,8" fill="#e74c3c" stroke="#b71c1c" stroke-width="2"/></svg>',
          // 中：菱形
          '<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,5 25,14 14,23 3,14" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/></svg>',
          // 高：正三角
          '<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,6 24,20 4,20" fill="#2ecc71" stroke="#145a32" stroke-width="2"/></svg>'
        ];

        if (!btnGroup || !slider || !sliderValue || !joy1Canvas || !joy2Canvas) return;

        if (!buf || buf.length < 3) return false;
        if (buf[0] !== 0x22) return false;
        const len = buf[1];
        if (buf.length < len + 2) return false;
        const crc = buf[len+1];
        const calcCrc = crc8tab_js(buf.slice(2,2+len-1), len-1);
        if (crc !== calcCrc) return false;
        let recvChannel = [];
        for(let i=0;i<10;i++){
          let off = 8 + i*2;
          let val = buf[off] | (buf[off+1]<<8);
          recvChannel[i] = val;
        }

        // 死区处理函数：在1500附近±5范围内保持稳定
        const applyDeadzone = (value, center = 1500, deadzone = 5) => {
          if (Math.abs(value - center) <= deadzone) {
            return center;
          }
          return value;
        };

        // 对前4个通道（摇杆通道）应用死区
        for(let i = 0; i < 4; i++) {
          recvChannel[i] = applyDeadzone(recvChannel[i]);
        }

        let joxy = [];

        // 前4个通道映射到摇杆
        // let joy1x = Math.round((recvChannel[0]-1500)/5);
        // let joy1y = Math.round((recvChannel[1]-1500)/5);
        // let joy2x = Math.round((recvChannel[3]-1500)/5);
        // let joy2y = Math.round((recvChannel[2]-1500)/5);
        for(let i = 0;i<4;i++)
        {
            if(recvChannel[i]==0) 
            {
              //conlole.log("通道数据异常，全部为0");
              console.log("异常小");
              return; // 避免初始数据异常导致的显示问题
            }
        }
        
        joxy[0] = Math.round((recvChannel[0]-1500)/5);
        joxy[1] = Math.round((recvChannel[1]-1500)/5);
        joxy[2] = Math.round((recvChannel[3]-1500)/5);
        joxy[3] = Math.round((recvChannel[2]-1500)/5);
        for(let i = 0;i<4;i++)
        {
            if(joxy[i]>100)
            {
              //console.log("异常大:",joxy[i],";recvChannel:",recvChannel,";buf:",buf);
              joxy[i] = 100;
              //return;
            }
            else if(joxy[i]<-100)
            {
              //console.log("异常小:",joxy[i],";recvChannel:",recvChannel,";buf:",buf);
              joxy[i] = -100;
              //return;
            }
        }
        const calibElements = [          //映射表
            { barId: 'calib-bar-rh', valId: 'val-bar-rh' ,dir:2},   // 右进度条2          
            { barId: 'calib-bar-rv', valId: 'val-bar-rv' ,dir:1},  // 右进度条1
            { barId: 'calib-bar-lv', valId: 'val-bar-lv' ,dir:1},  // 左进度条1
            { barId: 'calib-bar-lh', valId: 'val-bar-lh' ,dir:2},  // 左进度条2
            // { barId: 'calib-bar-rl', valId: 'val-bar-rl' },  // 右进度条1
            // { barId: 'calib-bar-rh', valId: 'val-bar-rh' },   // 右进度条2    
          ];

          // document.getElementById('calib-bar-lh')?.children[0].style.width  = ((recvChannel[1]-988)/(2012-988)*100) + '%';
          // document.getElementById('calib-bar-rv')?.children[0].style.width  = ((recvChannel[2]-988)/(2012-988)*100) + '%';
          // document.getElementById('calib-bar-rh')?.children[0].style.width  = ((recvChannel[3]-988)/(2012-988)*100) + '%';
          let tmpChannel = [];
          tmpChannel[0] = recvChannel[2];
          tmpChannel[1] = recvChannel[3];
          tmpChannel[2] = recvChannel[1];
          tmpChannel[3] = recvChannel[0];
          for (let i = 0; i < calibElements.length; i++) {
            const { barId, valId, dir } = calibElements[i];
            
            // 更新数值显示
            const valElement = document.getElementById(valId);
              if (valElement) {
                let tmpData = (recvChannel[i]-1500)/5;
                if(tmpData>100) tmpData=100;
                else if(tmpData<-100) tmpData=-100;
                valElement.textContent = Math.round(tmpData); // 假设processedCalib是校准数据数组
             }
            
            // 更新实际数值显示（-100到100范围）
            const actualValElement = document.getElementById(`val-actual-${['lv', 'lh', 'rv', 'rh'][i]}`);
            if (actualValElement) {
              actualValElement.textContent = Math.round(tmpChannel[i]);
            }
            
            // 更新进度条宽度
            const barFill = document.getElementById(barId)?.children[0];
            if (barFill) {

              {

                barFill.style.width = `${((recvChannel[i] - 988) / (2012 - 988) * 100)}%`;
              }
            }
          }
        }
        // 三态开关
        for(let i=0;i<5;i++){
          let btn = btnGroup.children[i];
          let v = recvChannel[4+i];
          let stateIdx = 1;
          if (v < 1300) stateIdx = 0;
          else if (v > 1700) stateIdx = 2;
          btn.dataset.state = stateNames[stateIdx];
          btn.querySelector('.calib-btn-svg').innerHTML = stateSvgs[stateIdx];
        }
        // 进度条（第10通道）
        let s1val = recvChannel[9];
        let percent = Math.round((s1val-988)/(2012-988)*100);
        slider.value = percent;
        sliderValue.textContent = percent;
        slider.style.background = `linear-gradient(90deg, #4f8cff ${percent}%, #e0e7ff ${percent}%)`;
      }

          const adcMin = window._adcMin || [0,0,0,0,0];
          // 中心点

          let data = new Uint8Array(28);
          for (let i = 0; i < 4; i++) {
            // max
            data[i*6+0] = adcMax[i] & 0xFF;
            data[i*6+1] = (adcMax[i] >> 8) & 0xFF;
            // min
            data[i*6+2] = adcMin[i] & 0xFF;
            data[i*6+3] = (adcMin[i] >> 8) & 0xFF;
            // zero
            let zero = recvMidAdc[i];

          data[24] = 4096 & 0xFF;
          data[25] = (4096 >> 8) & 0xFF;
          data[26] = 0;
          data[27] = 0;
          // zero 固定2048

          let buf = new Uint8Array(3+28+2);

          // 连续发送三次，每次间隔0.5秒

        fwLoadLocalBinBtn.textContent = LANGS[currentLang]['fw-load-local-bin'];

    // 设备类型变化时清空文件列表

    //fwFileBtn.onclick = () => fwFileInput.click();

    // ========== PATCH: 固件更新页面增强 ==========

    fwProgressText.style.color = '#fff';
    fwProgressText.style.textShadow = '0 1px 4px #3358e0, 0 0 2px #000';
    // 2. 新增"进入固件更新状态"按钮

    fwEnterUpdateBtn.onclick = async function() {

    };
    const fwCard = document.getElementById('fw-card');

      fwCard.insertBefore(fwEnterUpdateBtn, fwUpdateBtn);
    }
    // 3. 进入页面时自动检测下位机 YMODEM 握手：下位机连续发 0x43('C')
    let fwReadyCheckActive = false;
    let fwCStreak = 0;
    let fwCRecentWindow = [];
    const FW_C_WINDOW_SIZE = 16;
    let fwReadyCheckTimer = null;
    let fwSend31Timer = null;
    let fwSend31Count = 0;
    const FW_SEND31_MAX = 6;
    const FW_SEND31_INTERVAL_MS = 500;
    let fwLastSerialLen = 0;
    let fwBaudRateDetectionTimer = null; // 波特率检测定时器
    let fwSensorDetectionTimer = null; // sensor检测命令持续发送定时器
    let fwCurrentTryBaudRate = 460800; // 当前尝试的波特率，优先460800
    let fwBaudRateCheckCount = 0; // 检测计数，用于3秒超时
    window.fwReadyCheckActive = false;

    function resetFwCDetection() {
      fwCStreak = 0;
      fwCRecentWindow = [];
    }

    function isFwYmodemReady() {
      if (fwCStreak >= 3) return true;
      const cInWindow = fwCRecentWindow.filter(b => b === 0x43).length;
      return cInWindow >= 3;
    }

    function stopFwReadyCheck(reason) {
      const wasActive = fwReadyCheckActive || window.fwReadyCheckActive;
      fwReadyCheckActive = false;
      window.fwReadyCheckActive = false;
      baudRateDetectionActive = false;
      if (fwReadyCheckTimer) clearInterval(fwReadyCheckTimer);
      if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
      if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
      if (fwSend31Timer) clearInterval(fwSend31Timer);
      fwReadyCheckTimer = null;
      fwBaudRateDetectionTimer = null;
      fwSensorDetectionTimer = null;
      fwSend31Timer = null;
      resetFwCDetection();
      if (reason && wasActive) {
        console.log('[FW] stopFwReadyCheck:', reason);
      }
    }
    window.stopFwReadyCheck = stopFwReadyCheck;

    function completeFwReadyCheck(reason) {
      if (!fwReadyCheckActive) return;
      const streak = fwCStreak;
      const windowC = fwCRecentWindow.filter(b => b === 0x43).length;
      stopFwReadyCheck(null);
      if (fwUpdateBtn) {
        fwUpdateBtn.disabled = false;
        console.log(`[FW] YMODEM 就绪(${reason})，解锁确认更新按钮 (波特率: ${currentBaudRate}, streak=${streak}, windowC=${windowC})`);
      }
      fwStatus.textContent = LANGS[currentLang]['fw-ready-update'];
      upDataFlag = 2;
      updateFwUI();
      serialBuffer = serialBuffer.filter(b => b !== 0x43);
    }

    /** 串口收到数据时实时检测 0x43，不依赖 serialBuffer 轮询 */
    function feedFwYmodemReadyBytes(bytes) {
      if (!fwReadyCheckActive || !bytes || bytes.length === 0) return false;
      let triggered = false;
      for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        if (b === 0x43) {
          fwCStreak++;
        } else {
          fwCStreak = 0;
        }
        fwCRecentWindow.push(b);
        while (fwCRecentWindow.length > FW_C_WINDOW_SIZE) fwCRecentWindow.shift();
        if (fwCStreak >= 3 && !triggered) {
          completeFwReadyCheck('连续3×C');
          triggered = true;
          // 继续处理剩余字节，不要提前return
        }
      }
      if (triggered) return true;
      if (fwCRecentWindow.filter(x => x === 0x43).length >= 3) {
        completeFwReadyCheck('窗口内3×C');
        return true;
      }
      return false;
    }

    window.feedFwYmodemReadyBytes = feedFwYmodemReadyBytes;

    function startFwReadyCheck() {
      fwReadyCheckActive = true;
      window.fwReadyCheckActive = true;
      resetFwCDetection();
      fwBaudRateCheckCount = 0;
      fwCurrentTryBaudRate = 460800; // 优先尝试460800
      if (fwUpdateBtn) fwUpdateBtn.disabled = true; // 再加一层保险
      fwStatus.textContent = LANGS[currentLang]['fw-wait-update-cmd'];
      if (fwReadyCheckTimer) clearInterval(fwReadyCheckTimer);
      if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
      if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
      console.log('[FW] 开始监听 YMODEM 握手 (0x43)，fwReadyCheckActive已设置为true，upDataDev:', upDataDev, 'upDataFlag:', upDataFlag);
      
      // 如果是sensor更新，启动波特率检测
      if(upDataDev=="sensor"&&upDataFlag==1) {
        if (currentOS === 'Windows') {
          // Windows系统：启动波特率切换检测（在460800和420000之间切换）
          baudRateDetectionActive = true;
          console.log('[BaudRate] Windows系统：开始sensor更新模式，将在460800和420000之间切换检测');
          // 立即切换到460800并开始检测
          switchBaudRateForDetection(460800).then(() => {
            // 启动检测循环
            startBaudRateDetection();
          });
        } else {
          // Mac系统：不支持420000，只使用460800，不进行切换
          baudRateDetectionActive = false;
          console.log(`[BaudRate] ${currentOS}系统：sensor更新模式，仅使用460800波特率（不支持420000切换）`);
          // 确保使用460800波特率
          if (currentBaudRate !== 460800) {
            switchBaudRateForDetection(460800);
          }
        }
      }
      
      // 兜底：定期检查是否就绪，检测主要由 feedFwYmodemReadyBytes 实时完成
      fwReadyCheckTimer = setInterval(() => {
        if (!fwReadyCheckActive) return;
        // 不要在这里强制禁用按钮，按钮状态应该只由 completeFwReadyCheck 控制
        if (isFwYmodemReady()) {
          completeFwReadyCheck('定时器兜底');
        }
      }, 200);
    }
    
    // 波特率检测专用切换函数（用于sensor更新模式）
    async function switchBaudRateForDetection(targetBaudRate) {
      if (!port || !isSerialConnected) {
        console.error('[BaudRate] 无法切换波特率：串口未连接');
        return false;
      }
      
      // 如果当前已经是目标波特率，不需要切换
      if (currentBaudRate === targetBaudRate) {
        console.log(`[BaudRate] 当前已是${targetBaudRate}波特率，无需切换`);
        // 清空buffer并发送检测命令
        serialBuffer = [];
        resetFwCDetection();
        sendSensorDetectionCommands();
        return true;
      }
      
      try {
        console.log(`[BaudRate] 检测模式：切换波特率 ${currentBaudRate} -> ${targetBaudRate}`);
        
        // 停止读取循环
        isSerialConnected = false;
        
        // 释放reader
        if (reader) {
          try {
            await reader.cancel();
            reader.releaseLock();
          } catch (e) {
            console.warn('[BaudRate] 释放reader时出错:', e);
          }
          reader = null;
        }
        
        // 释放writer
        if (writer) {
          try {
            writer.releaseLock();
          } catch (e) {
            console.warn('[BaudRate] 释放writer时出错:', e);
          }
          writer = null;
        }
        
        // 关闭串口
        try {
          await port.close();
        } catch (e) {
          console.warn('[BaudRate] 关闭串口时出错:', e);
        }
        
        // 重新打开串口（新波特率）
        try {
          await port.open({ baudRate: targetBaudRate });
        } catch (error) {
          console.error(`[BaudRate] 无法切换到${targetBaudRate}波特率:`, error.message);
          console.log(`[BaudRate] 可能是Mac系统不支持${targetBaudRate}波特率`);
          // 如果切换失败，尝试恢复原波特率
          try {
            await port.open({ baudRate: currentBaudRate });
            writer = port.writable.getWriter();
            reader = port.readable.getReader();
            isSerialConnected = true;
            readLoop();
          } catch (e) {
            console.error('[BaudRate] 恢复原波特率也失败:', e);
            isSerialConnected = false;
          }
          return false;
        }
        
        // 重新获取writer和reader
        writer = port.writable.getWriter();
        reader = port.readable.getReader();
        
        // 更新当前波特率
        currentBaudRate = targetBaudRate;
        fwCurrentTryBaudRate = targetBaudRate;
        isSerialConnected = true;
        
        // 重新启动读取循环
        readLoop();
        
        // 清空buffer并发送检测命令
        serialBuffer = [];
        resetFwCDetection();
        sendSensorDetectionCommands();
        
        console.log(`[BaudRate] 检测模式：波特率切换成功 ${targetBaudRate}`);
        return true;
      } catch (error) {
        console.error(`[BaudRate] 检测模式：切换波特率失败 (${targetBaudRate}):`, error);
        isSerialConnected = false;
        return false;
      }
    }
    
    // 发送sensor检测命令（持续发送3秒，每200ms发送一次）
    async function sendSensorDetectionCommands() {
      if (!writer) return;
      
      // 清除之前的定时器
      if (fwSensorDetectionTimer) {
        clearInterval(fwSensorDetectionTimer);
        fwSensorDetectionTimer = null;
      }
      
      // 立即发送一次
      try {
        console.log('sendSensorDetectionCommands - 开始持续发送');
        setTimeout(async () => {
          if (writer) await writer.write(new Uint8Array([0x60, 0xF1, 0x55, 0x55]));  
        }, 20);
        
        setTimeout(async () => {
          if (writer) await writer.write(new Uint8Array([0xA5, 0x66, 0x01, 0x0D, 0x0A]));
        }, 40);
      } catch (e) {
        console.error('[BaudRate] 发送检测命令失败:', e);
      }
      
      // 启动定时器，每200ms发送一次，持续3秒（3秒后会切换波特率）
      let sendCount = 0;
      const maxSends = 15; // 3秒 / 200ms = 15次
      //console.log('[BaudRate] 启动持续发送定时器，将每200ms发送一次，持续3秒');
      fwSensorDetectionTimer = setInterval(async () => {
        //console.log('[BaudRate] 定时器触发，sendCount:', sendCount, 'writer:', !!writer, 'baudRateDetectionActive:', baudRateDetectionActive, 'fwReadyCheckActive:', fwReadyCheckActive);
        
        if (!writer || !baudRateDetectionActive || !fwReadyCheckActive) {
          //console.log('[BaudRate] 条件不满足，停止定时器');
          if (fwSensorDetectionTimer) {
            clearInterval(fwSensorDetectionTimer);
            fwSensorDetectionTimer = null;
          }
          return;
        }
        
        sendCount++;
        //console.log('[BaudRate] 准备发送，当前次数:', sendCount, '/', maxSends);
        
        if (sendCount >= maxSends) {
          // 3秒到了，停止发送（等待切换波特率）
          //console.log('[BaudRate] 已发送', maxSends, '次，停止定时器');
          if (fwSensorDetectionTimer) {
            clearInterval(fwSensorDetectionTimer);
            fwSensorDetectionTimer = null;
          }
          return;
        }
        
        try {
          //console.log('[BaudRate] 持续发送检测命令 - 第', sendCount, '次');
          if (writer) await writer.write(new Uint8Array([0x60, 0xF1, 0x55, 0x55]));  
          await new Promise(resolve => setTimeout(resolve, 20)); // 等待20ms
          if (writer) await writer.write(new Uint8Array([0xA5, 0x66, 0x01, 0x0D, 0x0A]));
        } catch (e) {
          console.error('[BaudRate] 持续发送检测命令失败:', e);
        }
      }, 100); // 每100ms发送一次
    }
    
    // 启动波特率检测循环（每3秒切换一次，仅Windows系统）
    function startBaudRateDetection() {
      if (!baudRateDetectionActive) return;
      
      // Mac系统不支持420000，不进行切换检测
      if (currentOS !== 'Windows') {
        console.log(`[BaudRate] ${currentOS}系统不支持420000波特率切换，停止检测`);
        baudRateDetectionActive = false;
        return;
      }
      
      if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
      if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
      
      fwBaudRateDetectionTimer = setInterval(async () => {
        if (!baudRateDetectionActive || !fwReadyCheckActive) {
          if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
          if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
          return;
        }
        
        // 再次检查操作系统（防止运行时变化）
        if (currentOS !== 'Windows') {
          console.log(`[BaudRate] ${currentOS}系统不支持420000波特率切换，停止检测`);
          baudRateDetectionActive = false;
          if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
          if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
          return;
        }
        
        fwBaudRateCheckCount++;
        console.log(`[BaudRate] 检测周期 ${fwBaudRateCheckCount}：当前尝试 ${fwCurrentTryBaudRate} 波特率`);
        
        // 检查是否收到3个C（使用实时累计，不依赖 serialBuffer 快照）
        if (isFwYmodemReady()) {
          console.log(`[BaudRate] 检测到3个C，确认波特率为 ${fwCurrentTryBaudRate}`);
          baudRateDetectionActive = false;
          if (fwBaudRateDetectionTimer) clearInterval(fwBaudRateDetectionTimer);
          if (fwSensorDetectionTimer) clearInterval(fwSensorDetectionTimer);
          completeFwReadyCheck('波特率检测');
          return;
        }
        
        // 没收到3个C，切换到另一个波特率（仅Windows系统）
        resetFwCDetection();
        if (fwCurrentTryBaudRate === 460800) {
          // 当前是460800，切换到420000
          console.log('[BaudRate] 460800未检测到3个C，切换到420000尝试');
          const success = await switchBaudRateForDetection(420000);
          if (!success) {
            // 如果无法切换到420000，继续用460800
