    // ========== 全局唯一定时器+函数指针式任务注册 ==========
    window._globalChannelTimer = null;
    window._globalChannelTask = null;
    function startGlobalChannelTimer(intervalMs) {
      const ms = (typeof intervalMs === 'number' && intervalMs > 0) ? intervalMs : 20;
      if (window._globalChannelTimer) {
        if (window._globalChannelTimerMs === ms) {
          return;
        }
        stopGlobalChannelTimer();
      }
      window._globalChannelTimerMs = ms;
      console.log('[定时器] 启动全局通道定时器', ms + 'ms');
      window._globalChannelTimer = setInterval(() => {
        if (!isSerialConnected || !writer) return;
        if (typeof window._globalChannelTask === 'function') {
          window._globalChannelTask();
        } else if (window._globalChannelTask && window._globalChannelTask.channelRequest) {
          window._globalChannelTask.channelRequest();
        }
      }, ms);
    }
    function stopGlobalChannelTimer() {
      if (window._globalChannelTimer) {
        console.log('[定时器] 停止全局通道定时器');
        clearInterval(window._globalChannelTimer);
        window._globalChannelTimer = null;
        window._globalChannelTimerMs = 0;
      }
    }

    function tryParseNetProgress(buf){
      if (!buf || buf.length < 3) return false;
      if (buf[0] !== 0x23) return false;
      const len = buf[1];
      if (buf.length < len + 2) return false;
      const crc = buf[len+1];
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
      if (crc !== calcCrc) return false;
      //console.log('buf:',buf);
      return true;
    }


    function tryParseAdcPacketCalib(buf) {
      var pageCalib = document.getElementById('page-calib');
      if (!pageCalib || pageCalib.style.display === 'none') return false;

      if (!buf || buf.length < 3) return false;
      if (buf[0] !== 0x33) return false;
      const len = buf[1];
      if (buf.length < len + 2) return false;
      const crc = buf[len+1];
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
      if (crc !== calcCrc) return false;

      // CaliFlag
      const CaliFlag = buf[12];

      // 5个ADC
      let recvAdc = [];
      for (let i = 0; i < 5; i++) {
        let off = 2 + i*2;
        recvAdc[i] = buf[off] | (buf[off+1]<<8);
      }

      // 方向（4字节，0/1）
      let recvAdcInputDir = [];
      for (let i = 0; i < 4; i++) {
        recvAdcInputDir[i] = buf[11+2+i];
      }

      // 映射（4字节）
      let adcMap = [];
      for (let i = 0; i < 4; i++) {
        adcMap[i] = buf[15+2+i];
      }

      // 校准数据（5组，每组6字节，max/min/mid）
      let recvAdcCailData = [];
      for (let i = 0; i < 5; i++) {
        let base = 19+2+i*6;
        let max = buf[base] | (buf[base+1]<<8);
        let min = buf[base+2] | (buf[base+3]<<8);
        let mid = buf[base+4] | (buf[base+5]<<8);
        recvAdcCailData[i] = [max, min, mid];
      }

      // 计算tmpData（摇杆归一化到-100~100）
      let tmpData = [];
      for (let i = 0; i < 5; i++) {
        let adc = recvAdc[i];
        let max = recvAdcCailData[i][0];
        let min = recvAdcCailData[i][1];
        let mid = recvAdcCailData[i][2];
        if (adc >= mid) {
          tmpData[i] = 1.0 * (adc - mid) * 100 / (max - mid);
          if (tmpData[i] > 100) tmpData[i] = 100;
        } else {
          tmpData[i] = -100 + 1.0 * (adc - min) * 100 / (mid - min);
          if (tmpData[i] < -100) tmpData[i] = -100;
        }
        // 方向反转，始终用映射后的通道
        if (i < 4 && recvAdcInputDir[adcMap[i]]) tmpData[i] = -tmpData[i];
      }

      // 打印调试
      //console.log('[ADC包] CaliFlag:', CaliFlag, 'recvAdc:', recvAdc, 'adcMap:', adcMap, 'recvAdcInputDir:', recvAdcInputDir, 'recvAdcCailData:', recvAdcCailData, 'tmpData:', tmpData);

      // 动态映射摇杆显示，适配所有硬件
      const joy1Canvas = document.getElementById('joystick1');
      const joy2Canvas = document.getElementById('joystick2');
      // 右摇杆：X=tmpData[adcMap[1]], Y=tmpData[adcMap[0]]
      drawJoystick(joy2Canvas, tmpData[adcMap[1]], tmpData[adcMap[0]]);
      // 左摇杆：X=tmpData[adcMap[3]], Y=tmpData[adcMap[2]]
      drawJoystick(joy1Canvas, tmpData[adcMap[3]], tmpData[adcMap[2]]);

      // 电位器 tmpData[4] 显示到进度条
      const slider = document.getElementById('calib-slider');
      const sliderValue = document.getElementById('calib-slider-value');
      // 计算电位器百分比
      let adcNow = recvAdc[4];
      let adcMin = recvAdcCailData[4][1];
      let adcMax = recvAdcCailData[4][0];
      let percent = 0;
      if (adcMax !== adcMin) {
        percent = Math.round((adcNow - adcMin) * 100 / (adcMax - adcMin));
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;
      }
      if (slider) slider.value = percent;
      if (sliderValue) sliderValue.textContent = percent;
      if (slider) slider.style.background = `linear-gradient(90deg, #4f8cff ${percent}%, #e0e7ff ${percent}%)`;

      // 实时收集最大最小值，便于校准
      if (!window._adcMax) window._adcMax = [0,0,0,0,0];
      if (!window._adcMin) window._adcMin = [65535,65535,65535,65535,65535];
      for (let i = 0; i < 4; i++) {
        if(recvAdc[i]>100 && recvAdc[i]<4000)                 //解决因为可能是0带来的干扰，导致最大最小值异常 因为摇杆的范围是大概在300 - 3600左右
        {
          if(recvAdc[i] > window._adcMax[i]) window._adcMax[i] = recvAdc[i];
          if(recvAdc[i] < window._adcMin[i]) window._adcMin[i] = recvAdc[i];
        }
      }
        if (recvAdc[4] > window._adcMax[4]) window._adcMax[4] = recvAdc[4];     //这个是电位器,无所谓的,就是最大最小,而且范围刚刚好就是 0-4095
        if (recvAdc[4] < window._adcMin[4]) window._adcMin[4] = recvAdc[4];

      let isCalib = 0;

      for (let i = 0; i < 4; i++) {   
        if(recvAdc[i]==0)
        {
          console.log('[ADC校准异常] 为',i,'的值为0',buf);
        }

        if((window._adcMax[i]-recvMidAdc[i]>400) && (recvMidAdc[i]-window._adcMin[i]>400))
        {
          isCalib++;
        }
        else
        {
          console.log('[ADC校准] 当前最大值:', window._adcMax, '最小值:', window._adcMin,'当前中立点:',recvMidAdc,'当前校准状态:',isCalib);
        }
      }
      // if(window._adcMax[4]>3000 && window._adcMin[4]<1000)
      // {
      //   isCalib++;
      // }
      if(isCalib==4)
      {
        //console.log('使能失败,请检查摇杆是否正常');
        console.log('[ADC校准] 当前最大值:', window._adcMax, '最小值:', window._adcMin,'当前中立点:',recvMidAdc);
        document.getElementById('calib-action-btn').disabled = false;
        document.getElementById('calib-save-action-btn').disabled = false;
      }
      // 控制台输出当前最大最小值
      //console.log('[ADC校准] 当前最大值:', window._adcMax, '最小值:', window._adcMin);

      return true;
    }


    function tryParseMidAdcPacketCalib(buf) {
        // 只在校准页面可见时刷新控件
        var pageCalib = document.getElementById('page-calib');
        if (!pageCalib || pageCalib.style.display === 'none') return false;

        if (!buf || buf.length < 3) return false;
        if (buf[0] !== 0x34) return false;
        const len = buf[1];
        if (buf.length < len + 2) {
          mt8CalibDbg('MID-0x34', '数据不完整', { need: len + 2, got: buf.length });
          return false;
        }
        const crc = buf[len+1];
        const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
        if (crc !== calcCrc) {
          mt8CalibLogCrcFail('0x34-MID', buf, len, crc, calcCrc);
          return false;
        }
        mt8CalibDbg('MID-0x34', 'CRC OK', { len, state: window.carCalibState });

        // 解析4个16位中立点
        const midValues = [];
        for (let i = 0; i < 4; i++) {
          let off = 2 + i*2;
          let val = buf[off] | (buf[off+1]<<8);
          recvMidAdc[i] = val;
          midValues[i] = val;
        }
        if (isMT8Device() && typeof window.setCarMidAdcFromPacket === 'function') {
          window.setCarMidAdcFromPacket(midValues);
        }
        // 打印到控制台
        console.log('[校准中心点] 解析到4个中立点:', recvMidAdc);

        // 标志位
        if (recvMidAdc[0] !== 0) {
          console.log('[校准中心点] 获得了校准中心点');
        }
        return true;
    }


    function tryParseDRChannelPacket(buf) {
      if (!buf || buf.length < 5) return false; // 至少需要5字节: 0x89 + len(7) + 7字节数据 + CRC
      if (buf[0] !== 0x9A) return false;
      const len = buf[1];
      if (!buf ||  buf.length < len + 2) return false; // 数据长度应该是7字节
      const crc = buf[len+1]; // buf[8]
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1); // 计算buf[2]到buf[7]的CRC
      if (crc !== calcCrc) {
        //console.warn('[DR包] CRC校验失败:', '期望', calcCrc, '实际', crc);

      }
      


      let OrgValue = buf[5] + buf[6]*256 ;

      const selectedChannel = expoWireToUiIndex(buf[2]);
      channelSelect.value = String(selectedChannel);

      }
      if (outIdx >= 0 && outIdx < changeChannelData.length) {
        changeChannelData[outIdx] = ChangeValue;
      }
      if (origIdx < 0 && outIdx < 0) {
        return null;
      }


      // 解析数据包
      // buf[0] = 0x9A (包类型)
      // buf[1] = 6 (数据长度)
      // buf[2] = channel (当前通道，从1开始: 1,2,3,4)
      // buf[3-4] = cCrsfChannels[channel-1][0] (控制位低字节)
      // buf[5-6] = cCrsfOriginalChannels 
      // buf[7] = CRC
      
      // function uint8ToInt8(uint8Value) {
      //     // 核心转换逻辑：超过127则减256
      //     return uint8Value > 127 ? uint8Value - 256 : uint8Value;
      // }



      return true;


    }

    function tryParseDRPacket(buf) {
      if (!buf || buf.length < 5) return false; // 至少需要5字节: 0x89 + len(7) + 7字节数据 + CRC
      if (buf[0] !== 0x89) return false;
      const len = buf[1];
      if (!buf ||  buf.length < len + 2) return false; // 数据长度应该是7字节
      const crc = buf[len+1]; // buf[8]
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1); // 计算buf[2]到buf[7]的CRC
      if (crc !== calcCrc) {
        //console.warn('[DR包] CRC校验失败:', '期望', calcCrc, '实际', crc);
        return false;
      }
      
      // 解析数据包
      // buf[0] = 0x89 (包类型)
      // buf[1] = 7 (数据长度)
      // buf[2] = channel（1 基：1=第一通道，见 expoWireToUiIndex）
      // buf[3] = channelCtl[channel-1][0] (控制位低字节)
      // buf[4] = channelCtl[channel-1][1] (控制位高字节)
      // buf[5] = channelDR[channel-1][0] (DR低字节)
      // buf[6] = channelDR[channel-1][1] (DR高字节)
      // buf[7] = channelEXPO[channel-1][0] (EXPO低字节)
      // buf[8] = channelEXPO[channel-1][1] (EXPO高字节)
      // buf[9] = CRC
      
      const channelWire = buf[2] & 0xFF;
      const channel = expoWireToUiIndex(channelWire);
      const channelCtl = (buf[3] & 0xFF) | ((buf[4] & 0xFF) << 8);
      // Rate/Expo 各占一字节有符号：buf[5]=左Rate buf[6]=右Rate buf[7]=左Expo buf[8]=右Expo
      const drLeft = uint8ToSignedInt8(buf[5]);
      const drRight = uint8ToSignedInt8(buf[6]);
      const expoLeft = uint8ToSignedInt8(buf[7]);
      const expoRight = uint8ToSignedInt8(buf[8]);
      
      console.log('[DR包] 解析成功:', {
        channelWire: channelWire,
        channelUi: channel,
        channelCtl: channelCtl,
        drLeft: drLeft,
        drRight: drRight,
        expoLeft: expoLeft,
        expoRight: expoRight,
        raw: Array.from(buf).map(x => '0x' + x.toString(16).padStart(2, '0').toUpperCase()).join(' ')
      });
      
      const switchEnable = buf[3] & 0xFF;
      const swWire = buf[4] & 0xFF;
      const switchChannel = isMT8Device() ? (switchEnable ? 1 : 0) : switchEnable;
      const reverse = isMT8Device() ? 0 : swWire;

      if (typeof window._expoPendingQueryChannel === 'number' &&
          !expoResponseMatchesQuery(channelWire, window._expoPendingQueryChannel)) {
        console.warn('[DR包] 通道与查询不一致，忽略。查询wire=', window._expoPendingQueryChannel,
          '回包wire=', channelWire, '回包ui=', channel,
          'raw=', Array.from(buf).map(x => '0x' + x.toString(16).padStart(2, '0').toUpperCase()).join(' '));
        return true;
      }

      const channelIndex = channel;
      const maxChannelIndex = getExpoChannelCount();
      if (channelIndex >= 0 && channelIndex < maxChannelIndex) {
        const channelSelect = document.getElementById('expo-channel-select');
        if (channelSelect) {
          channelSelect.value = channelIndex;
        }
        
        const switchChannelSelect = document.getElementById('expo-switch-channel-select');
        if (switchChannelSelect) {
          if (isMT8Device()) {
            switchChannelSelect.value = switchChannel ? '1' : '0';
            refreshMt8ExpoSwitchSwSelect(swWire);
          } else if (switchChannel >= 0 && switchChannel <= 15) {
            switchChannelSelect.value = switchChannel;
          }
        }
        
        if (!isMT8Device() && typeof window.setExpoDirGear === 'function') {
          let dirGear = reverse;
          if (dirGear < 1 || dirGear > 3) dirGear = 2;
          window.setExpoDirGear(dirGear);
        }
        
        // MT8：0xBC/HMI 接管 Rate；T8L：0x89 查询回包直接更新可编辑 Rate
        if (isMT8Device() && window._hmiDrRateLock) {
          if (typeof applyHmiDrRatesToCurrentChannel === 'function') {
            applyHmiDrRatesToCurrentChannel();
          }
        } else {
          const kSliderLeft = document.getElementById('k-slider-left');
          const kInputLeft = document.getElementById('k-input-left');
          if (kSliderLeft && kInputLeft) {
            kSliderLeft.value = drLeft;
            kInputLeft.value = Math.round(drLeft);
          }

          const kSliderRight = document.getElementById('k-slider-right');
          const kInputRight = document.getElementById('k-input-right');
          if (kSliderRight && kInputRight) {
            kSliderRight.value = drRight;
            kInputRight.value = Math.round(drRight);
          }
        }
        
        // 更新左侧Expo值
        const expoSliderLeft = document.getElementById('expo-slider-left');
        const expoInputLeft = document.getElementById('expo-input-left');
        if (expoSliderLeft && expoInputLeft) {
          expoSliderLeft.value = expoLeft;
          expoInputLeft.value = Math.round(expoLeft);
        }
        
        // 更新右侧Expo值
        const expoSliderRight = document.getElementById('expo-slider-right');
        const expoInputRight = document.getElementById('expo-input-right');
        if (expoSliderRight && expoInputRight) {
          expoSliderRight.value = expoRight;
          expoInputRight.value = Math.round(expoRight);
        }
        
        // 重新绘制图表
        if (typeof drawExpoGraph === 'function') {
          drawExpoGraph();
        }

        if (typeof window.setExpoPageDataReady === 'function') {
          window.setExpoPageDataReady(true);
        }
        
        console.log('[DR包] 页面参数已更新:', {
          channelWire: channelWire,
          channelUi: channel,
          switchChannel: switchChannel,
          reverse: reverse ? 'REV' : 'NOR',
          drLeft: drLeft,
          drRight: drRight,
          expoLeft: expoLeft,
          expoRight: expoRight
        });
      }
      
      return true;
    }

        g_linkState.upLinkRssiAnt1          = buf[2];           // uint8_t -> 无符号8位整数

    // 校准页面任务
    // 全局定时器和任务管理
    window._globalChannelTimer = null;  // 用于通道数据请求 (20ms)
    window._globalCommandTimer = null;  // 用于其他指令请求 (1000ms)
    window._globalChannelTask = null;

    // 清理所有定时器
    function clearAllTimers() {
      if (window._globalChannelTimer) {
        clearInterval(window._globalChannelTimer);
        window._globalChannelTimer = null;
      }
      if (window._globalCommandTimer) {
        clearInterval(window._globalCommandTimer);
        window._globalCommandTimer = null;
      }
      window._globalChannelTask = null;
    }

    // 启动定时器
    function startTimers(task) {
      clearAllTimers();
      window._globalChannelTask = task;
      
      // 通道数据请求定时器 - 20ms
      if (task && task.channelRequest) {
        window._globalChannelTimer = setInterval(() => {
          if (!isSerialConnected || !writer) return;
          if (window._globalChannelTask && window._globalChannelTask.channelRequest) {
            window._globalChannelTask.channelRequest();
          }
        }, 20);
      }
      
      // 其他指令请求定时器 - 1000ms
      if (task && task.commandRequest) {
        window._globalCommandTimer = setInterval(() => {
          if (!isSerialConnected || !writer) return;
          if (window._globalChannelTask && window._globalChannelTask.commandRequest) {
            window._globalChannelTask.commandRequest();
          }
        }, 1000);
      }
    }

    // 配置页面任务
    function createConfigTask(configStepRef) {
      return {
        channelRequest: () => {
          if (configStepRef.value === 2) {
            writer.write(new Uint8Array([0xA5,0x55,0x02,0x0D,0x0A])); // 通道数据
          }
        },
        commandRequest: () => {
          if (configStepRef.value === 0) {
            writer.write(new Uint8Array([0xA5,0x55,0x0D,0,0,0x0D,0x0A])); // map
          } else if (configStepRef.value === 1) {
            writer.write(new Uint8Array([0xA5,0x55,0x1F,0x0D,0x0A])); // trim/center
          }
        }
      };
    }

    // 校准页面任务
    function createCalibTask(calibStepRef, calibStateRef) {
      return {
        channelRequest: () => {
          if (calibStepRef.value === 1 && calibStateRef.value === 'idle') {
            writer.write(new Uint8Array([0xA5,0x55,0x02,0x0D,0x0A])); // 通道数据
          }
        },
        commandRequest: () => {
          if (calibStepRef.value === 0) {
            writer.write(new Uint8Array([0xA5,0x55,0x0D,0,0,0x0D,0x0A])); // map
          }
        }
      };
    }

    // ========== 操作模式十字摇杆绘制函数 ==========
    function drawCross(canvas, modeMap, isLeft) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const center = canvas.width / 2;
      const axisLen = canvas.width / 2 - 40;
      const arrowSize = 16;
      ctx.save();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = 'blue';
      // 画十字线
      ctx.beginPath();
      ctx.moveTo(center, center - axisLen); // 上
      ctx.lineTo(center, center + axisLen); // 下
      ctx.moveTo(center - axisLen, center); // 左
      ctx.lineTo(center + axisLen, center); // 右
      ctx.stroke();
      // 画箭头函数（更精致）
      function drawArrow(x, y, dx, dy) {
        ctx.save();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        if (dx === 0 && dy === -1) { // 上
          ctx.moveTo(x, y - arrowSize);
          ctx.lineTo(x - arrowSize * 0.6, y + arrowSize * 0.7);
          ctx.lineTo(x + arrowSize * 0.6, y + arrowSize * 0.7);
          ctx.closePath();
        } else if (dx === 0 && dy === 1) { // 下
          ctx.moveTo(x, y + arrowSize);
          ctx.lineTo(x - arrowSize * 0.6, y - arrowSize * 0.7);
          ctx.lineTo(x + arrowSize * 0.6, y - arrowSize * 0.7);
          ctx.closePath();
        } else if (dx === -1 && dy === 0) { // 左
          ctx.moveTo(x - arrowSize, y);
          ctx.lineTo(x + arrowSize * 0.7, y - arrowSize * 0.6);
          ctx.lineTo(x + arrowSize * 0.7, y + arrowSize * 0.6);
          ctx.closePath();
        } else if (dx === 1 && dy === 0) { // 右
          ctx.moveTo(x + arrowSize, y);
          ctx.lineTo(x - arrowSize * 0.7, y - arrowSize * 0.6);
          ctx.lineTo(x - arrowSize * 0.7, y + arrowSize * 0.6);
          ctx.closePath();
        }
        ctx.stroke();
        ctx.restore();
      }
      // 画四个箭头
      drawArrow(center, center - axisLen, 0, -1); // 上
      drawArrow(center, center + axisLen, 0, 1);  // 下
      drawArrow(center - axisLen, center, -1, 0); // 左
      drawArrow(center + axisLen, center, 1, 0);  // 右
      // 画标签（位置优化+美化）
      ctx.save();
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      // 阴影提升可读性
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 4;
      // 纵向标签（上下）向左偏移20px
      // 横向标签（左右）向上偏移20px
      if (isLeft) {
        // modeMap[0]上下，modeMap[1]左右
        ctx.fillStyle = 'black';
        ctx.fillText(modeMap[0], center - 20, center - axisLen / 2); // 上
        ctx.fillText(modeMap[0], center - 20, center + axisLen / 2); // 下
        ctx.fillText(modeMap[1], center - axisLen / 2, center - 20); // 左
        ctx.fillText(modeMap[1], center + axisLen / 2, center - 20); // 右
      } else {
        // modeMap[2]上下，modeMap[3]左右
        ctx.fillStyle = 'black';
        ctx.fillText(modeMap[2], center - 20, center - axisLen / 2); // 上
        ctx.fillText(modeMap[2], center - 20, center + axisLen / 2); // 下
        ctx.fillText(modeMap[3], center - axisLen / 2, center - 20); // 左
        ctx.fillText(modeMap[3], center + axisLen / 2, center - 20); // 右
      }
      ctx.restore();
    }

    // ========== 摇杆绘制函数，确保全局可用 ==========
    function drawJoystick(canvas, x, y) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#f4f6fb';
  ctx.fillRect(0, 0, w, h);

  // 线段最大长度，距离边框8%宽度
  const margin = w * 0.04; // 4%边距
  const maxRadius = w / 2 - margin;

  // 中心圆和指示点的半径也用比例
  const centerCircleRadius = w * 0.025; // 2.5%
  const pointerRadius = w * 0.025;      // 2.5%

  // 十字辅助线
  ctx.save();
  ctx.setLineDash([w * 0.012, w * 0.01]);
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = w * 0.002;
  ctx.beginPath();
  ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h);
  ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
  ctx.stroke();
  ctx.restore();

  // 中心圆
  ctx.beginPath();
  ctx.arc(w/2, h/2, centerCircleRadius, 0, 2 * Math.PI);
  ctx.fillStyle = '#e74c3c';
  ctx.shadowColor = '#e74c3c';
  ctx.shadowBlur = w * 0.01;
  ctx.fill();
  ctx.shadowBlur = 0;

  // 计算指针终点
  let bx = w/2 + (x||0) * maxRadius / 100;
  let by = h/2 - (y||0) * maxRadius / 100;

  // 指针线段
  ctx.save();
  ctx.strokeStyle = '#3358e0';
  ctx.lineWidth = w * 0.008;
  ctx.beginPath();
  ctx.moveTo(w/2, h/2);
  ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.restore();

  // 指针终点圆
  ctx.beginPath();
  ctx.arc(bx, by, pointerRadius, 0, 2 * Math.PI);
  ctx.fillStyle = '#111';
  ctx.shadowColor = '#111';
  ctx.shadowBlur = w * 0.01;
  ctx.fill();
  ctx.shadowBlur = 0;
}

      if (buf[0] !== 0x55) return false;
      const len = buf[1];
      if (buf.length < len + 2) return false;
      const crc = buf[len+1];
      const calcCrc = crc8tab_js(buf.slice(2, 2+len-1), len-1);
      if (crc !== calcCrc) return false;
      if(buf[10] !== 0x01)

        console.log('异常数据全为0');

    function getCenterCommandArray() {
      const arr = [0, 0, 0, 0];
      const count = (typeof isMT8Device === 'function' && isMT8Device()) ? 2 : 4;
      for (let j = 0; j < count; j++) {
        const el = document.getElementById(`center-input-${j}`);
        arr[j] = el ? (parseInt(el.value, 10) || 0) : 0;
      }
      if (count < 4 && window.channelMap && window.channelMap.channelMidSend) {
        for (let j = count; j < 4; j++) {
          arr[j] = Math.round((window.channelMap.channelMidSend[j] || 0) * 100 / 512);
        }
      }
      window._center = arr;
      return arr;
    }

    function sendCenterCommand(centerArr) {
      // centerArr: 4个通道的center，单位-100~100
      let data = new Uint8Array(3+8+2);
      data[0] = 0xA5;
      data[1] = 0x55;
      data[2] = 0x1A;
      
      // 确保 channelMap 存在
      if (!window.channelMap) {
        window.channelMap = {
          channelMidSend: [0,0,0,0]
        };
      }
      
      for (let i = 0; i < 4; i++) {
        let val = Math.round(centerArr[i] * 512 / 100);
        if (window.channelMap.channelMidSend) {
          window.channelMap.channelMidSend[i] = val;
        }
        data[3+i*2] = val & 0xFF;
        data[3+i*2+1] = (val >> 8) & 0xFF;
      }
      // 后面4字节补0
      //for (let i = 11; i < 11+4; i++) data[i] = 0;
      data[11] = 0x0D;
      data[12] = 0x0A;
      writer.write(data);
      console.log('[中立点指令] 已发送:', Array.from(data).map(x=>x.toString(16).padStart(2,'0')).join(' '));
    }

    // ===== 语言切换核心逻辑 =====

    function getLang() {
        // console.log('[ATTR] 获取语言:', currentLang);
        // if (currentLang === 'auto') {
        //   const nav = navigator.language || navigator.userLanguage;
        //   return nav.startsWith('zh') ? 'zh' : 'en';
        // }
      return currentLang;
    }
    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      updateLangUI();
      updateAllLangText();
    }
    function updateLangUI() {
      const btn = document.getElementById('lang-switcher');
      if (!btn) return;
      let txt = '🌐';
      //let txt = '';
      //if (currentLang === 'auto') txt += 'Auto';
      //else 
      if (currentLang === 'en') txt += 'EN';
      else txt += '中文';
      btn.textContent = txt;
    }

    // ===== 语言切换按钮事件 =====
    document.getElementById('lang-switcher').onclick = function() {
      //if (currentLang === 'auto') setLang('zh');
      //else if (currentLang === 'zh') setLang('en');
      //else setLang('auto');
      if (currentLang === 'zh') setLang('en');
      else setLang('zh');
      //console.log('[ATTR] 语言切换:', currentLang);
      updateAllLangText();
      //autoTranslateAllText();
      //showMainPage("attr");
    };

    // ===== 典型用法：所有可切换文本都用 data-i18n="key" 属性标记 =====
    function updateAllLangText() {
      const lang = getLang();
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        //console.log('[ATTR] 更新语言:', key, lang, LANGS[lang][key]);
        if (LANGS[lang] && LANGS[lang][key]) {
          // 特殊处理：数据源切换按钮需要根据状态动态设置文本
          if (key === 'channel-data-source-raw' && /-data-source-toggle-btn$/.test(el.id)) {
            if (typeof window._channelDataSourceRaw !== 'undefined') {
              el.textContent = window._channelDataSourceRaw 
                ? (LANGS[lang]['channel-data-source-raw'] || '原始数据')
                : (LANGS[lang]['channel-data-source-output'] || '输出数据');
            } else {
              el.textContent = LANGS[lang][key];
            }
          } else {
            el.textContent = LANGS[lang][key];
          }
        }
      });
      if (typeof window.refreshFlightModeChannelI18n === 'function') {
        window.refreshFlightModeChannelI18n();
      }
    }


    // ===== 页面加载时自动刷新语言 =====
    updateLangUI();
    updateAllLangText();
    // ===== 你在JS里用提示时可以这样用 =====
    // fwStatus.textContent = LANGS[getLang()]['select_file'];
    // ===== 你在HTML里这样用 =====
    // <button data-i18n="confirm_update"></button>
    // <div data-i18n="update"></div>
    // ...


    // ===== 全局设备状态结构体 =====
    window.deviceStats = {
      devConnectStats: 0, // 连接状态
      bindConnect: 0,     // 是否连接接收机
      txLinkSnr: 0,       // 下载SNR
      rxLinkSnr: 0,       // 上传SNR
      rxbatteryVoltage: 0, // 接收机电池电压
      rxbatteryCurrent: 0, // 接收机电池电流
      txbatteryVoltage: 0, // 下位机电压adc
      txBattery: 0        // 下位机当前电量百分比
    };

    // ===== 电量显示刷新函数 =====

    // ===== 数据包解析：收到0x11头部时解析并存入全局结构体 =====
    function parseDeviceStats(buf) {
      if (!buf || buf.length < 15) return 0;
      if (buf[0] !== 0x11) return 0;
      const len = buf[1];
      // CRC校验
      let tmp = crc8(buf.slice(2, 2+len-1));
      //console.log('parseDeviceStats Running', buf);
      //if (buf[len+1] !== tmp) return 0;
      // 解析数据
      //console.log('parseDeviceStats Running', buf);
      window.deviceStats.devConnectStats = 5;
      window.deviceStats.bindConnect = buf[2];
      window.deviceStats.downLinkRssi = buf[3];
      window.deviceStats.upLinkRssi = buf[4];
      window.deviceStats.rxbatteryVoltage = (buf[5] | (buf[6]<<8));
      window.deviceStats.rxbatteryCurrent = (buf[7] | (buf[8]<<8));
      // window.deviceStats.rxBattery = buf[9]; // 你说先不用
      window.deviceStats.txbatteryVoltage = (buf[10] | (buf[11]<<8));
      window.deviceStats.txBattery = buf[12];
      window._batteryPercent = buf[12];

      console.log('parseDeviceStats: devConnectStats=', window.deviceStats.devConnectStats);
      //             'bindConnect=', window.deviceStats.bindConnect,
      //             'txLinkSnr=', window.deviceStats.txLinkSnr,
      //             'rxLinkSnr=', window.deviceStats.rxLinkSnr,
      //             'rxbatteryVoltage=', window.deviceStats.rxbatteryVoltage,
      //             'rxbatteryCurrent=', window.deviceStats.rxbatteryCurrent,
      //             'txbatteryVoltage=', window.deviceStats.txbatteryVoltage,
      //             'txBattery=', window.deviceStats.txBattery);
      // 立即更新信号强度显示
      // if (typeof updateSignalStrength === 'function') {
      //   updateSignalStrength(window.deviceStats.txLinkSnr);
      // }


      if(deviceStats.bindConnect!=1)
      {
        document.getElementById('refresh-settings-rx').disabled = true;
        updateSignalStrength(0);
      }  
      else if((0xFF - deviceStats.downLinkRssi) <=40 )
      {
        document.getElementById('refresh-settings-rx').disabled = false;
        updateSignalStrength(4);
      }  
      else if((0xFF - deviceStats.downLinkRssi) <=60 )
      {
        document.getElementById('refresh-settings-rx').disabled = false;
        updateSignalStrength(3);
      }  
      else if((0xFF - deviceStats.downLinkRssi) <=80 )
      {
        document.getElementById('refresh-settings-rx').disabled = false;
        updateSignalStrength(2);
      }  
      else if((0xFF - deviceStats.downLinkRssi) <=100)
      {
        document.getElementById('refresh-settings-rx').disabled = false;
        updateSignalStrength(1);
      }  

      // 刷新原有电量栏
      updateDeviceInfoBar();

      // 返回1表示解析成功，让调用者知道可以移除这个数据包
      return 1;
    }

    // ===== CRC8算法 =====
    function crc8(arr) {
      let crc = 0;
      for (let i = 0; i < arr.length; i++) {
        crc ^= arr[i];
        for (let j = 0; j < 8; j++) {
          if (crc & 0x80) crc = (crc << 1) ^ 0x07;
          else crc <<= 1;
        }
        crc &= 0xFF;
      }
      return crc;
    }

/**
 * 更新信号强度显示
 * @param {number} state - 状态值：0=未连接，1-4=对应信号格数
 */
function updateSignalStrength(state) {
  const container = document.getElementById('signalContainer');
  if (!container) return;
  
  // 移除所有状态类
  container.classList.remove(
    'state-disconnected',
    'state-signal-1',
    'state-signal-2',
    'state-signal-3',
    'state-signal-4'
  );
  
  // 验证状态值，确保在有效范围内
  const validState = Math.min(Math.max(0, Math.floor(state || 0)), 4);
  
  // 添加对应状态类
  if (validState === 0) {
    container.classList.add('state-disconnected');
  } else {
    container.classList.add(`state-signal-${validState}`);
  }
}
